<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjudicator — Debate Judge Notes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);transition:background .3s,color .3s}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:rgba(255,255,255,0.04);--bg4:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.14);
  --text:#f0f0f5;--text2:rgba(255,255,255,0.55);--text3:rgba(255,255,255,0.28);
  --accent:#818cf8;--accent2:rgba(129,140,248,0.18);--accent3:rgba(129,140,248,0.35);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --font:'DM Sans','Segoe UI',sans-serif;--font-mono:'DM Mono','Courier New',monospace;
  --shadow:0 4px 24px rgba(0,0,0,0.5);
  --card-bg:rgba(255,255,255,0.035);
  --topbar-bg:rgba(8,8,14,0.98);
}
body.theme-light{
  --bg:#f4f4f8;--bg2:#fff;--bg3:rgba(0,0,0,0.04);--bg4:rgba(0,0,0,0.07);
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --text:#111118;--text2:rgba(0,0,0,0.55);--text3:rgba(0,0,0,0.3);
  --card-bg:rgba(255,255,255,0.8);--topbar-bg:rgba(244,244,248,0.98);
}
body.font-large{ font-size:15px; }
body.font-small{ font-size:12px; }
body.compact #content{ padding-top:12px; }
body.compact .speaker-card{ padding:10px; }
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
input,textarea,select,button{font-family:inherit}
textarea::placeholder,input::placeholder{color:var(--text3)}
select option{background:#1a1a2e;color:#fff}
button{cursor:pointer}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.fade-in{animation:fadeIn .4s ease both}
.slide-in{animation:slideIn .25s ease both}
.pop-in{animation:popIn .2s ease both}
#app{min-height:100vh}

/* ── atoms ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px}
.label-xs{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;display:block}
.divider{height:1px;background:var(--border);margin:16px 0}

/* ── textarea / input ── */
.note-textarea{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;padding:10px 13px;resize:vertical;min-height:64px;outline:none;line-height:1.65;font-family:var(--font);transition:border-color .15s}
.note-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(129,140,248,0.1)}

/* ── buttons ── */
.btn{padding:7px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.btn-primary{background:var(--accent2);color:var(--accent);border-color:var(--accent3)}
.btn-primary:hover{background:rgba(129,140,248,0.28)}
.btn-success{background:rgba(34,197,94,0.13);color:#4ade80;border-color:rgba(34,197,94,0.3)}
.btn-danger{background:rgba(239,68,68,0.11);color:#f87171;border-color:rgba(239,68,68,0.25)}
.btn-icon{padding:6px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);font-size:15px;line-height:1;transition:all .15s}
.btn-icon:hover{background:var(--bg4);color:var(--text)}

/* ── timer ── */
#timer-widget{position:fixed;bottom:24px;right:24px;z-index:9999;width:252px;background:rgba(4,4,12,0.97);border:1.5px solid rgba(255,255,255,0.12);border-radius:18px;padding:18px 20px;backdrop-filter:blur(20px);box-shadow:0 12px 48px rgba(0,0,0,0.7);transition:border-color .3s}
#timer-widget.over{border-color:#ef4444;animation:blink .9s step-end infinite}
#timer-mini{position:fixed;bottom:24px;right:24px;z-index:9999;background:rgba(4,4,12,0.97);border:1.5px solid rgba(255,255,255,0.12);border-radius:40px;padding:9px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
#timer-mini.over{background:#ef4444;border-color:#ef4444;animation:blink .9s step-end infinite}
#timer-display{font-family:var(--font-mono);font-size:38px;font-weight:700;letter-spacing:3px;text-align:center;line-height:1;transition:color .3s}
#timer-bar-track{background:rgba(255,255,255,0.1);border-radius:4px;height:5px;margin:12px 0 8px}
#timer-bar-fill{height:100%;border-radius:4px;transition:width .7s linear,background .3s}
.timer-phase-btn{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid;cursor:pointer;transition:all .15s}

/* ── top bar ── */
#topbar{position:sticky;top:0;z-index:100;background:var(--topbar-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
#topbar-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px}
#motion-bar{max-width:1440px;margin:0 auto;padding:0 20px 10px}
#motion-input{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:13px;padding:7px 14px;outline:none;font-style:italic;transition:border-color .15s}
#motion-input:focus{border-color:rgba(129,140,248,0.4);color:var(--text)}
#title-input{background:transparent;border:none;color:var(--text);font-size:14px;font-weight:700;outline:none;flex:1;min-width:0}
#round-input{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:5px 10px;width:88px;outline:none}
.tab-bar{max-width:1440px;margin:0 auto;display:flex;border-top:1px solid var(--border);padding:0 20px;gap:2px}
.main-tab{padding:10px 18px;background:none;border:none;color:var(--text3);border-bottom:2.5px solid transparent;font-size:12px;font-weight:700;transition:all .15s;letter-spacing:.2px}
.main-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.main-tab:hover{color:var(--text2)}

/* ── content ── */
#content{max-width:1440px;margin:0 auto;padding:24px 20px 160px}

/* ── team tab selector ── */
.team-tabs-row{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:6px;align-items:center}
.team-tab-btn{padding:9px 20px;border-radius:10px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);transition:all .15s;white-space:nowrap}
.team-tab-btn.active{font-weight:800}

/* ── team panel ── */
.team-panel{background:var(--card-bg);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.team-panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}

/* ── speaker card ── */
.speaker-card{background:var(--bg3);border-radius:12px;padding:16px;margin-bottom:12px;border-left:3.5px solid;border:1.5px solid var(--border);border-left-width:3.5px;transition:border-color .15s}
.speaker-card:hover{border-color:var(--border2)}
.score-display{font-size:28px;font-weight:800;line-height:1;font-family:var(--font-mono)}
.score-band{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:3px}

/* ── poi buttons ── */
.poi-btn{font-size:10px;padding:4px 10px;border-radius:20px;font-weight:700;border:1.5px solid;cursor:pointer;transition:all .15s;line-height:1.4}
.poi-btn:hover{filter:brightness(1.2)}

/* ── argument card ── */
.arg-card{background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;padding:13px;margin-bottom:9px;transition:border-color .15s}
.arg-card:hover{border-color:var(--border2)}
.arg-select{font-size:11px;padding:3px 8px;border-radius:var(--radius-xs);background:var(--bg4);color:var(--text);border:1.5px solid var(--border);outline:none;cursor:pointer}
.arg-textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:13px;resize:none;outline:none;line-height:1.55;min-height:36px;font-family:var(--font)}
.arg-status-standing{background:rgba(255,255,255,0.08)}
.arg-status-rebutted{background:rgba(239,68,68,0.12)}
.arg-status-conceded{background:rgba(34,197,94,0.12)}
.arg-status-dropped{background:rgba(120,120,120,0.12)}

/* ── score overview ── */
#score-overview{margin-top:20px;background:var(--bg3);border:1.5px solid var(--border);border-radius:14px;padding:20px}
.score-overview-col{text-align:center;padding:12px;border-radius:10px;background:var(--bg4)}

/* ── clash ── */
.clash-pair-label{font-size:12px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.clash-textarea{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;padding:10px 12px;resize:vertical;min-height:56px;outline:none;line-height:1.6;font-family:var(--font);transition:border-color .15s}
.clash-textarea:focus{border-color:var(--accent)}
.contr-textarea{width:100%;background:rgba(239,68,68,0.04);border:1.5px solid rgba(239,68,68,0.15);border-radius:var(--radius-sm);color:var(--text);font-size:13px;padding:10px 12px;resize:vertical;min-height:52px;outline:none;line-height:1.6;font-family:var(--font);transition:border-color .15s}
.contr-textarea:focus{border-color:rgba(239,68,68,0.4)}

/* ── OA ── */
#oa-textarea{width:100%;background:var(--bg3);border:1.5px solid rgba(129,140,248,0.25);border-radius:12px;color:var(--text);font-size:13px;padding:16px 18px;resize:vertical;min-height:320px;outline:none;line-height:1.75;font-family:var(--font-mono)}
#oa-textarea:focus{border-color:rgba(129,140,248,0.5);box-shadow:0 0 0 3px rgba(129,140,248,0.08)}

/* ── saved list ── */
.saved-card{background:var(--card-bg);border:1.5px solid var(--border);border-radius:14px;padding:18px;display:flex;gap:16px;align-items:flex-start;transition:border-color .15s,box-shadow .15s}
.saved-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}

/* ── scale popup ── */
.scale-popup{background:rgba(0,0,0,0.55);border-radius:10px;padding:12px;max-height:170px;overflow-y:auto;font-size:11px;margin-bottom:10px;border:1px solid var(--border)}

/* ── home ── */
.mode-card{padding:26px 22px;border-radius:18px;cursor:pointer;text-align:left;background:var(--card-bg);border:1.5px solid var(--border);transition:all .2s;outline:none;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
.mode-card:hover{background:rgba(129,140,248,0.09);border-color:rgba(129,140,248,0.45);transform:translateY(-2px);box-shadow:0 8px 28px rgba(129,140,248,0.15)}

/* ── OA rank cards ── */
.oa-rank-card{border-radius:12px;padding:14px;text-align:center;border:1.5px solid var(--border)}

/* ── bench analysis ── */
.bench-card{border-radius:12px;padding:14px;border:1.5px solid var(--border)}

/* ── settings panel ── */
.settings-overlay{position:fixed;inset:0;z-index:88000;background:rgba(0,0,0,0.65);display:flex;align-items:flex-start;justify-content:flex-end;backdrop-filter:blur(8px)}
.settings-panel{background:var(--bg2);border-left:1.5px solid var(--border);width:100%;max-width:460px;height:100vh;overflow-y:auto;display:flex;flex-direction:column;animation:slideInRight .22s cubic-bezier(.22,1,.36,1) both;box-shadow:-12px 0 48px rgba(0,0,0,0.5)}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.settings-header{padding:20px 24px 16px;border-bottom:1.5px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2;display:flex;align-items:center;justify-content:space-between}
.settings-section{padding:20px 24px;border-bottom:1px solid var(--border)}
.settings-section:last-child{border-bottom:none;padding-bottom:40px}
.settings-section-title{font-size:10px;font-weight:800;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.settings-section-title::after{content:"";flex:1;height:1px;background:var(--accent);opacity:.2}
.setting-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:16px}
.setting-row:last-child{margin-bottom:0}
.setting-label{font-size:13px;font-weight:600;color:var(--text)}
.setting-desc{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.45}
.toggle{width:44px;height:25px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;margin-top:1px}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 5px rgba(0,0,0,0.4)}
.toggle.on{background:var(--accent)}.toggle.off{background:rgba(255,255,255,0.18)}
.toggle.on::after{transform:translateX(19px)}
.setting-select{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:6px 10px;outline:none;cursor:pointer;min-width:120px}
.color-swatch{width:28px;height:28px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all .15s}
.color-swatch:hover{transform:scale(1.12)}
.color-swatch.selected{border-color:#fff;box-shadow:0 0 0 2px var(--accent);transform:scale(1.12)}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.settings-chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.settings-chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .15s}
.settings-chip.selected{background:var(--accent2);color:var(--accent);border-color:var(--accent3)}
.settings-chip:hover{border-color:var(--border2)}

/* ── section headers in judge view ── */
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.section-header-line{flex:1;height:1px;background:var(--border)}

/* ── flow view ── */
.flow-grid{display:grid;gap:0;overflow-x:auto;min-width:0}
.flow-col{min-width:180px;border-right:1px solid var(--border)}
.flow-col:last-child{border-right:none}
.flow-col-header{padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--topbar-bg);z-index:2}
.flow-note{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;line-height:1.5;min-height:60px;color:var(--text);background:transparent;border-left:none;border-right:none;border-top:none;resize:none;width:100%;outline:none;font-family:var(--font)}
.flow-note:focus{background:var(--bg3)}
.flow-arg-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:10px;margin:2px;font-weight:600;cursor:pointer;border:1px solid transparent}
.flow-link-btn{font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .15s}
.flow-link-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── quick-note hotbar ── */
#quick-hotbar{position:fixed;bottom:0;left:0;right:0;z-index:8888;background:var(--topbar-bg);border-top:1.5px solid var(--border);padding:10px 20px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(20px)}
#quick-input{flex:1;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;padding:8px 14px;outline:none;font-family:var(--font);transition:border-color .15s}
#quick-input:focus{border-color:var(--accent)}
#quick-team-sel{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:7px 10px;outline:none;cursor:pointer;flex-shrink:0}
.quick-note-item{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);margin-bottom:6px;font-size:12px;animation:popIn .2s ease both}
.quick-note-team{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;flex-shrink:0;margin-top:1px}

/* ── clash winner voting ── */
.clash-winner-row{display:flex;gap:6px;margin-top:8px;align-items:center}
.clash-winner-btn{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid;cursor:pointer;transition:all .15s;flex:1;text-align:center}
.clash-conf-row{display:flex;gap:4px;margin-top:6px}
.clash-conf-dot{width:12px;height:12px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}

/* ── argument link ── */
.arg-link-row{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.arg-link-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(129,140,248,0.12);color:var(--accent);border:1px solid var(--accent3);font-weight:600}

/* ── score bar chart ── */
.score-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.score-bar-track{flex:1;height:10px;border-radius:5px;background:var(--bg4);overflow:hidden}
.score-bar-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.score-bar-label{font-size:11px;font-weight:700;min-width:32px;text-align:right}
.score-bar-total{font-size:18px;font-weight:800;min-width:44px;font-family:var(--font-mono)}

/* ── deliberation mode ── */
#delib-overlay{position:fixed;inset:0;z-index:77777;background:var(--bg);overflow-y:auto}
.delib-topbar{position:sticky;top:0;z-index:2;background:var(--topbar-bg);border-bottom:1.5px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;backdrop-filter:blur(20px)}
.delib-timer{font-family:var(--font-mono);font-size:28px;font-weight:800;letter-spacing:2px}
.delib-team-col{background:var(--card-bg);border:1.5px solid var(--border);border-radius:14px;padding:16px;break-inside:avoid}
.delib-arg-row{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:12px;line-height:1.5;border-left:3px solid}

/* ── undo toast ── */
#undo-toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:9998;background:var(--bg2);border:1.5px solid var(--border2);border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:12px;font-size:13px;box-shadow:var(--shadow);animation:popIn .2s ease both}

/* ── print styles ── */
@media print {
  #topbar,#timer-widget,#timer-mini,#quick-hotbar,#delib-overlay,
  .btn,button,.settings-overlay,.main-tab,.team-tabs-row{display:none!important}
  body{background:#fff!important;color:#000!important;font-size:11pt}
  #content{padding:0!important;max-width:100%!important}
  .speaker-card,.arg-card,.note-textarea,.clash-textarea{
    border:1px solid #ccc!important;background:#f9f9f9!important;color:#000!important;break-inside:avoid
  }
  .score-bar-track{background:#eee!important}
  #score-overview{border:1px solid #ccc!important;background:#fff!important}
  .team-panel,.delib-team-col{border:1px solid #ccc!important;break-inside:avoid;margin-bottom:16pt}
  h2{border-bottom:2px solid #000;padding-bottom:4pt}
  @page{margin:1.5cm}
}
</style>
</head>

<div id="app"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════════════════════

// ── Convert app session → DB row ─────────────────────────────────────────────
function sessionToDb(s) {
  return {
    id:       s.id,
    title:    s.title    || "",
    mode:     s.mode,
    motion:   s.motion   || "",
    round:    s.round    || "",
    teams:    s.teams    || {},
    clashes:  s.clashes  || {},
    rankings: s.rankings || [],
    oa_notes: s.oaNotes  || "",
  };
}

// ── Convert DB row → app session ─────────────────────────────────────────────
function dbToSession(row) {
  return {
    id:         row.id,
    title:      row.title    || "",
    mode:       row.mode,
    motion:     row.motion   || "",
    round:      row.round    || "",
    teams:      row.teams    || {},
    clashes:    row.clashes  || {},
    rankings:   row.rankings || [],
    oaNotes:    row.oa_notes || "",
    savedAt:    row.updated_at || row.created_at || new Date().toISOString(),
    created_at: row.created_at || new Date().toISOString(),
    storageType: "cloud",
  };
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg, type) {
  let el = document.getElementById("adj-toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "adj-toast";
    el.style.cssText = "position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99999;padding:8px 20px;border-radius:20px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:opacity .35s;pointer-events:none;white-space:nowrap";
    document.body.appendChild(el);
  }
  const cols = { success:"#22c55e", warn:"#f59e0b", info:"#60a5fa", error:"#ef4444" };
  const col = cols[type] || cols.info;
  el.style.cssText += ";background:rgba(10,10,18,0.97);border:1px solid "+col+"55;color:"+col+";opacity:1";
  el.textContent = msg;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 3200);
}

function loadPrefs() {
  try {
    const stored = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
    Object.assign(PREFS, stored);
  } catch(e) {}
}
function savePrefs() {
  localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS));
}
function applyPrefs() {
  const b = document.body;
  // Theme
  b.classList.toggle("theme-light", PREFS.theme === "light");
  // Font size
  b.classList.remove("font-large","font-small");
  if (PREFS.fontSize === "large") b.classList.add("font-large");
  if (PREFS.fontSize === "small") b.classList.add("font-small");
  // Compact
  b.classList.toggle("compact", PREFS.compactMode);
  // Animations
  b.classList.toggle("no-anim", !PREFS.animationsEnabled);
  // CSS vars
  const r = document.documentElement.style;
  r.setProperty("--accent", PREFS.accent);
  r.setProperty("--accent2", PREFS.accent + "22");
  r.setProperty("--accent3", PREFS.accent + "44");
  if (PREFS.theme !== "light") {
    r.setProperty("--bg", PREFS.bgColor);
  }
  r.setProperty("--font", PREFS.fontChoice);
  // Timer position
  const tw = document.getElementById("timer-widget") || document.getElementById("timer-mini");
  if (tw) {
    tw.style.left  = PREFS.timerPosition === "bottom-left" ? "24px" : "";
    tw.style.right = PREFS.timerPosition === "bottom-left" ? ""     : "24px";
  }
}

function setPref(key, val) {
  PREFS[key] = val;
  savePrefs();
  applyPrefs();
  // Partial re-renders for things that need it
  if (["showMotionBar","defaultTab","showBenchAnalysis","showOAChecklist"].includes(key) && S.view === "judge") {
    render();
  }
}

  const overlay = document.createElement("div");
  overlay.className = "settings-overlay";
  overlay.id = "settings-overlay";
  overlay.innerHTML = renderSettingsPanel();
  document.body.appendChild(overlay);
  overlay.addEventListener("click", e => { if(e.target === overlay) closeSettings(); });

function closeSettings() {

async function loadSaved() {
  // 1. Show local immediately
  try { S.savedNotes = JSON.parse(localStorage.getItem("adj_sessions") || "[]"); } catch(e) { S.savedNotes = []; }

  if (!db) { cloudStatus = "offline"; render(); return; }

  // 2. Probe Supabase — a lightweight count query is enough to confirm reachability
  try {
    showToast("☁️ Connecting to cloud…", "info");
    const { data, error } = await db
      .from(TABLE)
      .select("*")
      .order("updated_at", { ascending: false });

    if (error) throw new Error(error.message);

    cloudStatus = "online";
    if (data && data.length > 0) {
      const cloudNotes = data.map(dbToSession);
      const cloudIds   = new Set(cloudNotes.map(n => n.id));
      const localOnly  = S.savedNotes.filter(n => !cloudIds.has(n.id));
      S.savedNotes = [...cloudNotes, ...localOnly];
      localStorage.setItem("adj_sessions", JSON.stringify(S.savedNotes));
      showToast("☁️ Synced " + cloudNotes.length + " session" + (cloudNotes.length !== 1 ? "s" : ""), "success");
    } else {
      showToast("☁️ Cloud connected — no sessions yet", "success");
    }
    render();
  } catch(e) {
    cloudStatus = "offline";
    console.error("Cloud sync error:", e.message);
    showToast("⚠ Cloud unavailable — " + e.message.slice(0, 60), "warn");
    render();
  }
}


function persistSaved() {

function timerPrepMax(){ return S.mode==="BP"?15*60:30*60; }
const SPEAKER_MAX=7*60+15;
function timerLimit(){ return S.timerPhase==="prep"?timerPrepMax():SPEAKER_MAX; }
function timerIsOver(){ return S.timerElapsed>timerLimit(); }
function timerIsWarning(){ return S.timerPhase==="speaker"&&S.timerElapsed>=6*60&&!timerIsOver(); }
function timerColor(){
  if(timerIsOver()) return "#ef4444";
  if(timerIsWarning()) return "#f59e0b";
  return "#22c55e";
}
function startTimerInterval(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    S.timerElapsed++;
    renderTimer();
  },1000);
}
function stopTimerInterval(){ clearInterval(timerInterval); }

function renderTimer(){
  const over=timerIsOver(), warn=timerIsWarning(), col=timerColor();
  const pct=Math.min((S.timerElapsed/timerLimit())*100,100);

  if(S.timerMinimized){
    document.getElementById("timer-widget")&&document.getElementById("timer-widget").remove();
    let mini=document.getElementById("timer-mini");
    if(!mini){
      mini=document.createElement("div");
      mini.id="timer-mini";
      mini.onclick=()=>{ S.timerMinimized=false; renderTimer(); };
      document.body.appendChild(mini);
    }
    mini.className="timer-mini"+(over?" over":"");
    mini.style.display="flex";
    mini.innerHTML=`<span style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:${over?"#fff":col}">${fmtTime(S.timerElapsed)}</span><span style="font-size:10px;color:rgba(255,255,255,0.45)">tap to expand</span>`;
    return;
  }
  document.getElementById("timer-mini")&&document.getElementById("timer-mini").remove();

  let w=document.getElementById("timer-widget");
  if(!w){
    w=document.createElement("div");
    w.id="timer-widget";
    document.body.appendChild(w);
  }
  w.className=""+(over?" over":"");
  w.style.borderColor=over?"#ef4444":"rgba(255,255,255,0.1)";

  const phaseLabel=S.timerPhase==="prep"
    ?`${S.mode} prep — ${S.mode==="BP"?"15:00":"30:00"} limit`
    :"7:15 limit · POI 1:00–6:00";

  w.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="display:flex;gap:4px">
        ${["prep","speaker"].map(p=>{
          const active=S.timerPhase===p;
          return `<button class="timer-phase-btn" onclick="timerSetPhase('${p}')" style="background:${active?col:"transparent"};color:${active?"#000":"rgba(255,255,255,0.45)"};border-color:${active?col:"rgba(255,255,255,0.15)"}">${p==="prep"?"PREP":"SPEAKER"}</button>`;
        }).join("")}
      </div>
      <button onclick="S.timerMinimized=true;renderTimer()" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:18px;line-height:1;padding:0">–</button>
    </div>
    <div id="timer-display" style="color:${col};animation:${over?"blink .9s step-end infinite":"none"}">${fmtTime(S.timerElapsed)}</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.35);text-align:center;margin-top:4px">${phaseLabel}</div>
    <div id="timer-bar-track"><div id="timer-bar-fill" style="width:${pct}%;background:${col}"></div></div>
    ${S.timerPhase==="speaker"?`<div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:8px"><span>1:00 open</span><span>6:00 close</span><span>7:15 stop</span></div>`:""}
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="timerToggle()" style="flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:13px;background:${S.timerRunning?"#ef4444":col};color:#000;border:none;transition:background .2s">${S.timerRunning?"⏸ PAUSE":"▶ START"}</button>
      <button onclick="timerReset()" style="padding:8px 14px;border-radius:8px;background:rgba(255,255,255,0.1);color:#fff;border:none;font-size:16px">↺</button>
    </div>
  `;
}
function timerSetPhase(p){ S.timerPhase=p; timerReset(); }
function timerToggle(){
  S.timerRunning=!S.timerRunning;
  if(S.timerRunning) startTimerInterval(); else stopTimerInterval();
  renderTimer();
}
function timerReset(){ S.timerElapsed=0; S.timerRunning=false; stopTimerInterval(); renderTimer(); }

// ══════════════════════════════════════════════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════════════════════════════════════════════
function render(){
  const app=document.getElementById("app");
  if(S.view==="home") { app.innerHTML=renderHome(); bindHome(); }
  else if(S.view==="saved") { app.innerHTML=renderSaved(); bindSaved(); }
  else if(S.view==="judge") { app.innerHTML=renderJudge(); bindJudge(); }
  // re-attach timer
  if(S.view==="judge") renderTimer();
  else { document.getElementById("timer-widget")&&document.getElementById("timer-widget").remove(); document.getElementById("timer-mini")&&document.getElementById("timer-mini").remove(); }
}

// START / LOAD SESSION
// ══════════════════════════════════════════════════════════════════════════════
function startNewSession(mode){
  S.mode=mode;
  S.teams=mode==="BP"?defaultBPSession():defaultAPSession();
  S.oaNotes=""; S.clashes={}; S.editingId=null;
  S.sessionTitle=`${mode} Session — ${new Date().toLocaleDateString()}`;
  S.motion=""; S.round="";
  S.quickNotes=[]; S.undoStack=[];
  S.activeTeamTab=mode==="BP"?"OG":"GOV";
  S.judgeTab=PREFS.defaultTab||"teams";
  S.showScale={};
  S.timerPhase="prep"; timerReset();
  if(PREFS.timerAutoStart){ S.timerRunning=true; startTimerInterval(); }
  S.view="judge";
  render();
}
function loadSession(note){
  S.mode=note.mode; S.teams=note.teams; S.oaNotes=note.oaNotes||"";
  S.clashes=note.clashes||{}; S.sessionTitle=note.title;
  S.motion=note.motion||""; S.round=note.round||""; S.editingId=note.id;
  S.quickNotes=note.quickNotes||[];
  S.activeTeamTab=note.mode==="BP"?"OG":"GOV";
  S.judgeTab=note.mode==="BP"?PREFS.defaultTab||"teams":PREFS.defaultTab||"teams";
  S.showScale={}; S.undoStack=[];
  S.timerPhase="prep"; timerReset();
  S.view="judge";
  render();
}

function renderSavedCard(note){

    ? `<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.2);font-weight:700">☁️ Cloud</span>`
    : `<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.45);border:1px solid rgba(255,255,255,0.1);font-weight:700">💾 Local</span>`;

function bindSaved(){}

function openSaved(id){
  const note=S.savedNotes.find(n=>n.id===id);
  if(note) loadSession(note);
}
function exportSession(id){
  const note = S.savedNotes.find(n => n.id === id);
  if (!note) return;
  showToast("📄 Generating PDF…", "info");

  const rankings = (note.rankings || []).sort((a,b) => a.autoRank - b.autoRank);
  const RANK_EMOJI_E = ["🥇","🥈","🥉","4th"];
  const tColors = { OG:"#818cf8", OO:"#fb923c", CG:"#4ade80", CO:"#f472b6", GOV:"#818cf8", OPP:"#fb923c" };
  const date = new Date(note.savedAt || note.created_at).toLocaleString();

  function teamBlock(teamId) {
    const t = note.teams[teamId]; if (!t) return "";
    const col = tColors[teamId] || "#818cf8";
    const total = (t.speakers||[]).reduce((s,sp)=>s+Number(sp.score||0),0);
    const poiLabel = {taken_excellent:"Excellent",taken_good:"Good",taken_poor:"Poor",refused:"Refused",offered:"Offered"};
    return `
      <div style="margin-bottom:24px;border:1px solid ${col}40;border-top:4px solid ${col};border-radius:10px;padding:16px;break-inside:avoid">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div>
            <span style="background:${col}20;color:${col};padding:2px 10px;border-radius:20px;font-weight:800;font-size:12px">${t.abbr}</span>
            <span style="margin-left:8px;font-size:14px;font-weight:700;color:#000">${t.label}</span>
          </div>
          <div style="font-size:18px;font-weight:800;color:${col}">Σ ${total}</div>
        </div>
        ${(t.speakers||[]).map(sp=>{
          const score=Number(sp.score||75);
          const sCol=score>=83?"#16a34a":score>=73?"#d97706":score>=64?"#ea580c":"#dc2626";
          const poisT=(sp.pois_taken||[]).reduce((acc,p)=>{acc[p]=(acc[p]||0)+1;return acc},{});
          const poisO=(sp.pois_offered||[]).length;
          return `
          <div style="margin-bottom:10px;padding:10px;background:#f8f9fc;border-radius:8px;border-left:3px solid ${col}">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
              <div>
                <span style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px">${sp.role}</span>
                ${sp.name?`<span style="margin-left:8px;font-weight:700;font-size:13px;color:#111">${sp.name}</span>`:""}
              </div>
              <span style="font-size:20px;font-weight:800;color:${sCol}">${score}</span>
            </div>
            ${Object.keys(poisT).length||poisO?`<div style="font-size:10px;color:#6b7280;margin-bottom:4px">POIs: ${Object.entries(poisT).map(([k,v])=>`${v}× ${poiLabel[k]||k}`).join(", ")}${poisO?` · ${poisO}× Offered`:""}</div>`:""}
            ${sp.notes?`<div style="font-size:12px;color:#374151;line-height:1.5;white-space:pre-wrap">${sp.notes}</div>`:""}
          </div>`;
        }).join("")}
        ${t.teamNotes?`<div style="margin-top:8px"><div style="font-size:10px;color:#6b7280;font-weight:700;text-transform:uppercase;margin-bottom:4px">Team Notes</div><div style="font-size:12px;color:#374151;line-height:1.5;white-space:pre-wrap">${t.teamNotes}</div></div>`:""}
        ${t.extension?`<div style="margin-top:8px;padding:8px;background:#fffbeb;border-radius:6px;border:1px solid #fde68a"><div style="font-size:10px;color:#92400e;font-weight:700;text-transform:uppercase;margin-bottom:4px">Extension / New Ground</div><div style="font-size:12px;color:#78350f;line-height:1.5;white-space:pre-wrap">${t.extension}</div></div>`:""}
        ${(t.arguments||[]).length?`
        <div style="margin-top:10px">
          <div style="font-size:10px;color:#6b7280;font-weight:700;text-transform:uppercase;margin-bottom:6px">Arguments Tracked</div>
          ${t.arguments.map(a=>`<div style="display:flex;gap:6px;margin-bottom:4px;padding:6px 8px;background:#fff;border:1px solid #e5e7eb;border-radius:6px">
            <span style="font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;background:${a.strength==="strong"?"#dcfce7":a.strength==="medium"?"#fef3c7":"#fee2e2"};color:${a.strength==="strong"?"#166534":a.strength==="medium"?"#92400e":"#991b1b"}">${a.strength}</span>
            <span style="font-size:10px;padding:1px 6px;border-radius:10px;background:#f3f4f6;color:#374151;font-weight:600">${a.tag}</span>
            <span style="font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;background:${a.status==="conceded"?"#dcfce7":a.status==="rebutted"?"#fee2e2":"#f3f4f6"};color:${a.status==="conceded"?"#166534":a.status==="rebutted"?"#991b1b":"#374151"}">${a.status}</span>
            <span style="font-size:12px;color:#111;flex:1">${a.text||""}</span>
          </div>`).join("")}
        </div>`:""}
      </div>`;
  }

  // Clash notes
  const clashHtml = Object.entries(note.clashes||{}).filter(([,v])=>v).map(([k,v])=>{
    const [a,b]=k.split("_vs_");
    return `<div style="margin-bottom:8px;padding:10px;background:#f8f9fc;border-radius:8px">
      <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:4px">
        <span style="color:${tColors[a]||"#818cf8"}">${a}</span> vs <span style="color:${tColors[b]||"#fb923c"}">${b}</span>
      </div>
      <div style="font-size:12px;color:#111;white-space:pre-wrap">${v}</div>
    </div>`;
  }).join("");

  const html = `
<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;color:#111;margin:0;padding:0;font-size:13px}
  h1{font-size:22px;font-weight:800;margin:0 0 4px}
  h2{font-size:15px;font-weight:700;margin:18px 0 10px;padding-bottom:4px;border-bottom:2px solid #e5e7eb}
  .meta{font-size:11px;color:#6b7280}
  .ranking-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .rank-chip{text-align:center;padding:10px 14px;border-radius:10px;min-width:80px}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div style="padding:32px;max-width:820px;margin:0 auto">

  <div style="margin-bottom:24px;padding-bottom:16px;border-bottom:3px solid #111">
    <div style="font-size:11px;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">ADJUDICATION NOTES</div>
    <h1>${note.title}</h1>
    <div class="meta">${note.mode} Debate · ${note.round?'Round '+note.round+' · ':''}${date}</div>
    ${note.motion?`<div style="margin-top:8px;padding:10px 14px;background:#f8f9fc;border-radius:8px;font-style:italic;color:#374151;font-size:13px">"${note.motion}"</div>`:""}
  </div>

  <h2>📊 Final Rankings</h2>
  <div class="ranking-row">
    ${rankings.map((r,i)=>{
      const col=tColors[r.id]||"#818cf8";
      return `<div class="rank-chip" style="background:${col}15;border:1px solid ${col}40">
        <div style="font-size:20px">${RANK_EMOJI_E[i]||"·"}</div>
        <div style="font-weight:800;color:${col};font-size:15px">${r.id}</div>
        <div style="font-size:18px;font-weight:800">${r.total}</div>
        <div style="font-size:10px;color:#6b7280">points</div>
      </div>`;
    }).join("")}
  </div>

  <h2>🗒 Team Notes</h2>
  ${(note.mode==="BP"?["OG","OO","CG","CO"]:["GOV","OPP"]).map(teamBlock).join("")}

  ${clashHtml?`<h2>⚔️ Clash Analysis</h2><div>${clashHtml}</div>`:""}

  ${note.oaNotes?`<h2>🎤 Oral Adjudication Notes</h2>
  <div style="white-space:pre-wrap;font-family:'Courier New',monospace;font-size:12px;background:#f8f9fc;border-radius:8px;padding:16px;line-height:1.7;color:#111">${note.oaNotes}</div>`:""}

  <div style="margin-top:32px;padding-top:12px;border-top:1px solid #e5e7eb;font-size:10px;color:#9ca3af;text-align:center">
    Generated by Adjudicator App · ${date}
  </div>
</div></body></html>`;

  // Use html2pdf if available, otherwise open print dialog
  if (typeof html2pdf !== "undefined") {
    const opt = {
      margin: 0,
      filename: (note.title||"session") + ".pdf",
      image: { type:"jpeg", quality:0.97 },
      html2canvas: { scale:2, useCORS:true },
      jsPDF: { unit:"mm", format:"a4", orientation:"portrait" },
    };
    const wrapper = document.createElement("div");
    wrapper.innerHTML = html;
    html2pdf().set(opt).from(wrapper.firstChild).save();
    showToast("📄 Downloading PDF…", "success");
  } else {
    // Fallback: open in new tab for print-to-PDF
    const win = window.open("", "_blank");
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 600);
    showToast("📄 Print dialog opened — save as PDF", "info");
  }
}
async function deleteSession(id){
  if(PREFS.confirmOnDelete && !confirm("Delete this session permanently?")) return;
  S.savedNotes=S.savedNotes.filter(n=>n.id!==id);
  persistSaved();
  render();
  // Also delete from cloud using SDK
  try {
    const { error } = await db.from(TABLE).delete().eq("id", id);
    if (error) throw new Error(error.message);
    showToast("🗑 Deleted from cloud", "info");
  } catch(e) {
    console.warn("Cloud delete failed:", e.message);
  }
}

    </div>
    ${PREFS.showMotionBar ? `<div id="motion-bar"><input id="motion-input" value="${esc(S.motion)}" placeholder="Motion: This House would / believes / supports…" oninput="S.motion=this.value"></div>` : ""}
    <div class="tab-bar">

function setJudgeTab(tab){ S.judgeTab=tab; render(); }

// ── TEAMS TAB ──
function renderTeamsTab(ids,rankings){
  const team=S.teams[S.activeTeamTab];
  if(!team) return "";
  return `
  <div class="slide-in">
    <div style="display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;align-items:center">
      ${ids.map(tid=>{
        const ri=rankings.find(r=>r.id===tid);
        const col=TEAM_COLORS[tid];
        const active=S.activeTeamTab===tid;
        return `<button class="team-tab-btn ${active?"active":""}" onclick="setActiveTeam('${tid}')"
          style="background:${active?col+"20":"rgba(255,255,255,0.04)"};border-color:${active?col+"50":"rgba(255,255,255,0.08)"};color:${active?col:"rgba(255,255,255,0.5)"}">
          ${tid} <span style="margin-left:6px;font-size:10px;color:${active?col:"rgba(255,255,255,0.3)"};">#${ri?ri.autoRank:"?"} · ${ri?ri.total:""}</span>
        </button>`;
      }).join("")}
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0">
        ${rankings.map((r,i)=>`<span style="font-size:10px;padding:3px 8px;border-radius:20px;background:${TEAM_COLORS[r.id]}15;color:${TEAM_COLORS[r.id]};border:1px solid ${TEAM_COLORS[r.id]}30;font-weight:700">#${i+1} ${r.id}</span>`).join("")}
      </div>
    </div>
    ${renderTeamPanel(team,rankings.find(r=>r.id===S.activeTeamTab))}
    ${renderScoreOverview(ids,rankings)}
  </div>`;
}
function setActiveTeam(tid){ S.activeTeamTab=tid; render(); }

function renderTeamPanel(team,rankInfo){
  const col=TEAM_COLORS[team.id];
  const total=team.speakers.reduce((s,sp)=>s+Number(sp.score||0),0);
  const rankColors=["","#ffd700","#c0c0c0","#cd7f32","#888"];
  return `
  <div style="background:rgba(255,255,255,0.03);border:1px solid ${col}25;border-top:3px solid ${col};border-radius:14px;overflow:hidden">
    <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px">
      <span class="badge" style="background:${col}20;color:${col};border:1px solid ${col}40">${team.abbr}</span>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:600">${team.label}</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.35)">${team.bench==="gov"?"Government":"Opposition"} · ${team.half==="opening"?"Opening":"Closing"}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:20px;font-weight:800;color:${col}">Σ ${total}</div>
        <div style="font-size:10px;color:${rankColors[rankInfo?.autoRank]||"#888"};font-weight:700">${rankInfo?"Rank #"+rankInfo.autoRank:"–"}</div>
      </div>
    </div>
    <div style="padding:16px">
      ${team.speakers.map((sp,i)=>renderSpeakerCard(sp,i,team.id,col)).join("")}
      <div style="margin-bottom:14px">
        <div class="label-xs" style="margin-bottom:6px">Team Notes</div>
        <textarea class="note-textarea" style="min-height:70px" oninput="updateTeamField('${team.id}','teamNotes',this.value)" placeholder="Overall team notes, case strategy, bench dynamics…">${esc(team.teamNotes||"")}</textarea>
      </div>
      ${(team.id==="CG"||team.id==="CO")?`
      <div style="margin-bottom:14px">
        <div class="label-xs" style="margin-bottom:6px">Extension / New Ground</div>
        <textarea class="note-textarea" style="min-height:60px;border-color:rgba(251,191,36,0.15)" oninput="updateTeamField('${team.id}','extension',this.value)" placeholder="What's new? Extension material, new characterizations, unique angles…">${esc(team.extension||"")}</textarea>
      </div>`:""}
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div class="label-xs">Arguments Tracker</div>
          <button class="btn" style="font-size:11px;padding:3px 10px;background:${col}20;color:${col};border-color:${col}40" onclick="addArgument('${team.id}')">+ Add</button>
        </div>
        <div id="args-${team.id}">
          ${(team.arguments||[]).map(arg=>renderArgCard(arg,team.id)).join("")}
          ${(team.arguments||[]).length===0?`<div style="font-size:12px;color:rgba(255,255,255,0.2);text-align:center;padding:12px 0">No arguments tracked — click + Add</div>`:""}
        </div>
      </div>
    </div>
  </div>`;
}

function renderSpeakerCard(sp,idx,teamId,col){
  const score=Number(sp.score||75);
  const scoreColor=score>=83?"#22c55e":score>=73?"#f59e0b":score>=64?"#f97316":"#ef4444";
  const showScale=S.showScale[sp.id]||false;
  const poisTaken=sp.pois_taken||[];
  const poisOffered=sp.pois_offered||[];
  const countOf=(type)=>type==="offered"?poisOffered.length:poisTaken.filter(p=>p===type).length;
  return `
  <div class="speaker-card" style="border-left-color:${col}">
    <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px">
      <div style="flex:1">
        <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:3px;font-weight:700;letter-spacing:.5px">${sp.role.toUpperCase()}</div>
        <input value="${esc(sp.name)}" placeholder="Speaker name…" oninput="updateSpeakerField('${teamId}',${idx},'name',this.value)"
          style="background:transparent;border:none;color:#fff;font-size:14px;font-weight:600;outline:none;width:100%">
      </div>
      <div style="text-align:center;min-width:60px">
        <div class="score-display" style="color:${scoreColor}">${score}</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.35)">/ 100</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <span style="font-size:11px;color:rgba(255,255,255,0.4);min-width:36px">Score</span>
      <input type="range" min="50" max="100" value="${score}" oninput="updateSpeakerScore('${teamId}',${idx},this.value)"
        style="flex:1;accent-color:${scoreColor}">
      <input type="number" min="50" max="100" value="${score}" oninput="updateSpeakerScore('${teamId}',${idx},this.value)"
        style="width:48px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:#fff;font-size:12px;text-align:center;padding:2px 4px;outline:none">
      <button onclick="toggleScale('${sp.id}')" style="background:none;border:none;color:rgba(255,255,255,0.3);font-size:13px;padding:0">?</button>
    </div>
    ${showScale?`<div class="scale-popup">${SPEAKER_SCALE.map(s=>`<div style="display:flex;gap:8px;margin-bottom:4px;color:rgba(255,255,255,0.7)"><span style="min-width:48px;color:#f59e0b;font-weight:700">${s.r}</span><span>${s.d}</span></div>`).join("")}</div>`:""}
    <div style="margin-bottom:8px">
      <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:4px">Speaker notes</div>
      <textarea class="note-textarea" oninput="updateSpeakerField('${teamId}',${idx},'notes',this.value)" placeholder="Notes on performance, arguments made, POI quality, style…">${esc(sp.notes||"")}</textarea>
    </div>
    <div>
      <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:6px">POI tracking</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${[
          {type:"taken_excellent",label:"✓✓ Excellent",col:"#22c55e"},
          {type:"taken_good",label:"✓ Good",col:"#86efac"},
          {type:"taken_poor",label:"~ Poor",col:"#f59e0b"},
          {type:"refused",label:"✗ Refused",col:"#ef4444"},
          {type:"offered",label:"→ Offered",col:"#60a5fa"},
        ].map(({type,label,col:pc})=>{
          const cnt=countOf(type);
          return `<button class="poi-btn" style="background:${pc}20;color:${pc};border-color:${pc}40" onclick="addPOI('${teamId}',${idx},'${type}')">${label}${cnt>0?" ("+cnt+")":""}</button>`;
        }).join("")}
        ${(poisTaken.length+poisOffered.length)>0?`<button class="poi-btn" style="background:rgba(239,68,68,0.1);color:#f87171;border-color:rgba(239,68,68,0.2)" onclick="clearPOIs('${teamId}',${idx})">clear</button>`:""}
      </div>
    </div>
  </div>`;
}

function renderArgCard(arg,teamId){
  const statusBg={standing:"rgba(255,255,255,0.08)",rebutted:"rgba(239,68,68,0.15)",conceded:"rgba(34,197,94,0.15)",dropped:"rgba(100,100,100,0.15)"};
  // Collect all args from OTHER teams for linking
  const ids=teamIds();
  const otherArgs=[];
  ids.filter(id=>id!==teamId).forEach(id=>{
    (S.teams[id]?.arguments||[]).forEach(a=>{ if(a.text) otherArgs.push({teamId:id,id:a.id,text:a.text.slice(0,40),col:TEAM_COLORS[id]}); });
  });
  const linkedArg = arg.rebuttsArgId ? otherArgs.find(a=>a.id===arg.rebuttsArgId) : null;
  return `
  <div class="arg-card" id="arg-${arg.id}">
    <div style="display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;align-items:center">
      <select class="arg-select" onchange="updateArgField('${teamId}','${arg.id}','strength',this.value)">
        ${["strong","medium","weak"].map(v=>`<option value="${v}" ${arg.strength===v?"selected":""}>${{strong:"💪 Strong",medium:"⚡ Medium",weak:"⚠ Weak"}[v]}</option>`).join("")}
      </select>
      ${PREFS.argTagsVisible?`<select class="arg-select" onchange="updateArgField('${teamId}','${arg.id}','tag',this.value)">${ARGUMENT_TAGS.map(t=>`<option value="${t}" ${arg.tag===t?"selected":""}>${t}</option>`).join("")}</select>`:""}
      <select class="arg-select" style="background:${statusBg[arg.status]||"rgba(255,255,255,0.08)"}" onchange="updateArgField('${teamId}','${arg.id}','status',this.value)">
        ${["standing","rebutted","conceded","dropped"].map(v=>`<option value="${v}" ${arg.status===v?"selected":""}>${{standing:"Standing",rebutted:"Rebutted",conceded:"Conceded ✓",dropped:"Dropped"}[v]}</option>`).join("")}
      </select>
      <button onclick="undoableDeleteArgument('${teamId}','${arg.id}')" style="margin-left:auto;background:none;border:none;color:rgba(255,100,100,0.6);font-size:14px;padding:0" title="Delete (undoable)">✕</button>
    </div>
    <textarea class="arg-textarea" oninput="updateArgField('${teamId}','${arg.id}','text',this.value)" placeholder="Argument summary…">${esc(arg.text||"")}</textarea>
    <div class="arg-link-row">
      <span style="font-size:10px;color:var(--text3)">↩ Rebuts:</span>
      ${linkedArg?`<span class="arg-link-chip" style="background:${linkedArg.col}18;color:${linkedArg.col};border-color:${linkedArg.col}30">${linkedArg.teamId}: ${esc(linkedArg.text)}… <button onclick="updateArgField('${teamId}','${arg.id}','rebuttsArgId',null)" style="background:none;border:none;color:inherit;font-size:11px;cursor:pointer;padding:0;margin-left:2px">×</button></span>`
      :`<select class="arg-select" style="font-size:10px" onchange="updateArgField('${teamId}','${arg.id}','rebuttsArgId',this.value)"><option value="">Link to opposing arg…</option>${otherArgs.map(a=>`<option value="${a.id}">[${a.teamId}] ${esc(a.text)}…</option>`).join("")}</select>`}
    </div>
  </div>`;
}

function renderScoreOverview(ids,rankings){
  const maxTotal = Math.max(...ids.map(tid => S.teams[tid]?.speakers.reduce((s,sp)=>s+Number(sp.score||0),0)||0));
  const rankLabels = ["","🥇","🥈","🥉","4️⃣"];
  return `
  <div id="score-overview">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span class="label-xs" style="margin:0">Score Overview</span>
      <span style="font-size:10px;color:var(--text3)">max possible: ${ids.length===4?200:225}</span>
    </div>
    ${ids.map(tid=>{
      const t=S.teams[tid], col=TEAM_COLORS[tid];
      const total=t.speakers.reduce((s,sp)=>s+Number(sp.score||0),0);
      const ri=rankings.find(r=>r.id===tid);
      const pct=maxTotal>0?Math.round((total/maxTotal)*100):0;
      return `
      <div class="score-bar-row">
        <div style="min-width:36px;font-size:11px;font-weight:800;color:${col}">${tid}</div>
        <div class="score-bar-track">
          <div class="score-bar-fill" style="width:${pct}%;background:${col}"></div>
        </div>
        <div class="score-bar-total" style="color:${col}">${total}</div>
        <div style="font-size:14px;min-width:24px">${rankLabels[ri?.autoRank]||""}</div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px;padding-left:44px">
        ${t.speakers.map(sp=>{
          const sc=Number(sp.score||75);
          const scCol=sc>=83?"#22c55e":sc>=73?"#f59e0b":sc>=64?"#f97316":"#ef4444";
          return `<div style="font-size:10px;color:var(--text3)">${sp.role.split(" ").pop()}: <span style="font-weight:700;color:${scCol}">${sc}</span></div>`;
        }).join("")}
      </div>`;
    }).join("")}
  </div>`;
}

// ── CLASH TAB ──
function renderClashTab(ids,rankings){
  const pairs=[];
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) pairs.push([ids[i],ids[j]]);

  // Tally clash wins for summary
  const wins={};
  ids.forEach(id=>wins[id]=0);
  pairs.forEach(([a,b])=>{
    const key=[a,b].sort().join("_vs_");
    const cl=S.clashes[key]||{};
    if(cl.winner===a) wins[a]++;
    else if(cl.winner===b) wins[b]++;
  });

  return `
  <div class="slide-in">
    <!-- Clash summary bar -->
    <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
      ${ids.map(tid=>{
        const col=TEAM_COLORS[tid];
        const w=wins[tid]||0;
        const total=pairs.length;
        return `<div style="flex:1;min-width:100px;padding:10px 14px;border-radius:10px;background:${col}10;border:1.5px solid ${col}25;text-align:center">
          <div style="font-size:11px;color:${col};font-weight:700">${tid}</div>
          <div style="font-size:22px;font-weight:800;color:${col}">${w}<span style="font-size:13px;color:var(--text3)">/${total}</span></div>
          <div style="font-size:10px;color:var(--text3)">clashes won</div>
        </div>`;
      }).join("")}
    </div>

    <div class="label-xs" style="margin-bottom:10px">Pairwise Clash Analysis</div>
    ${pairs.map(([a,b])=>{
      const key=[a,b].sort().join("_vs_");
      const cl=S.clashes[key]||{notes:"",winner:null,confidence:2};
      const colA=TEAM_COLORS[a], colB=TEAM_COLORS[b];
      const confDots=[1,2,3];
      return `
      <div style="margin-bottom:16px;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;padding:14px">
        <div class="clash-pair-label">
          <span style="color:${colA};font-weight:800">${a}</span>
          <span style="color:var(--text3);font-size:10px">vs</span>
          <span style="color:${colB};font-weight:800">${b}</span>
          ${cl.winner?`<span style="margin-left:auto;font-size:10px;padding:2px 8px;border-radius:10px;background:${TEAM_COLORS[cl.winner]}20;color:${TEAM_COLORS[cl.winner]};font-weight:700">→ ${cl.winner} wins</span>`:""}
        </div>
        <textarea class="clash-textarea" style="min-height:52px" oninput="updateClash('${key}','notes',this.value)" placeholder="Analysis — who made the stronger case here and why?">${esc(cl.notes||"")}</textarea>
        <div class="clash-winner-row">
          <span style="font-size:11px;color:var(--text3);flex-shrink:0">Winner:</span>
          ${[a,"Even",b].map(opt=>{
            const isTeam=opt!=="Even";
            const optCol=isTeam?TEAM_COLORS[opt]:"#888";
            const selected=cl.winner===opt||(opt==="Even"&&cl.winner==="Even");
            return `<button class="clash-winner-btn" onclick="updateClash('${key}','winner','${opt}')" style="background:${selected?optCol+"22":"transparent"};color:${selected?optCol:optCol+"88"};border-color:${selected?optCol:optCol+"33"}">${opt}</button>`;
          }).join("")}
          <span style="font-size:11px;color:var(--text3);flex-shrink:0;margin-left:8px">Confidence:</span>
          <div class="clash-conf-row">
            ${confDots.map(n=>`<div class="clash-conf-dot" onclick="updateClash('${key}','confidence',${n})" style="background:${(cl.confidence||2)>=n?"var(--accent)":"var(--border2)"}"></div>`).join("")}
          </div>
        </div>
      </div>`;
    }).join("")}

    <div style="margin-top:24px">
      <div class="label-xs" style="margin-bottom:10px">Contradiction Notes</div>
      ${ids.map(tid=>{
        const t=S.teams[tid], col=TEAM_COLORS[tid];
        const val=(t.contradictions||[]).join("\n");
        return `
        <div style="margin-bottom:10px;display:flex;gap:10px;align-items:flex-start">
          <div style="min-width:36px;height:36px;border-radius:8px;background:${col}20;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${col};border:1px solid ${col}30;flex-shrink:0">${tid}</div>
          <textarea class="contr-textarea" oninput="updateContradictions('${tid}',this.value)" placeholder="Contradictions noted in ${tid}?">${esc(val)}</textarea>
        </div>`;
      }).join("")}
    </div>

    ${S.mode==="BP"&&PREFS.showBenchAnalysis?renderBenchAnalysis(rankings):""}
  </div>`;
}
function renderBenchAnalysis(rankings){
  const benches=[
    {label:"Government Bench",ids:["OG","CG"],col:"#818cf8"},
    {label:"Opposition Bench",ids:["OO","CO"],col:"#fb923c"},
    {label:"Opening Half",ids:["OG","OO"],col:"#4ade80"},
    {label:"Closing Half",ids:["CG","CO"],col:"#f472b6"},
  ];
  return `
  <div style="margin-top:24px">
    <div class="label-xs" style="margin-bottom:10px">Bench &amp; Half Analysis</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${benches.map(b=>{
        const tots=b.ids.map(id=>S.teams[id]?.speakers.reduce((s,sp)=>s+Number(sp.score||0),0)||0);
        const winner=tots[0]>tots[1]?b.ids[0]:tots[1]>tots[0]?b.ids[1]:"Tied";
        return `
        <div style="background:${b.col}08;border:1px solid ${b.col}20;border-radius:10px;padding:12px">
          <div style="font-size:11px;color:${b.col};font-weight:700;margin-bottom:8px">${b.label}</div>
          ${b.ids.map((id,i)=>`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:rgba(255,255,255,0.5)">${id}</span><span style="font-weight:700;color:${winner===id?b.col:"rgba(255,255,255,0.7)"}">${tots[i]}</span></div>`).join("")}
          <div style="margin-top:8px;font-size:11px;color:${b.col};font-weight:600">${winner==="Tied"?"⚖️ Tied":"→ "+winner+" leads"}</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

// ── OA TAB ──
function renderOATab(rankings){
  const sorted=[...rankings].sort((a,b)=>a.autoRank-b.autoRank);
  return `
  <div class="slide-in">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:13px;font-weight:600">OA Preparation &amp; Ranking Summary</div>
      <button class="btn btn-primary" onclick="generateOATemplate()">✨ Auto-generate template</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:20px">
      ${sorted.map((r,i)=>{
        const t=S.teams[r.id], col=TEAM_COLORS[r.id];
        return `<div class="oa-rank-card" style="background:${col}10;border:1px solid ${col}30">
          <div style="font-size:20px">${RANK_EMOJI[i]}</div>
          <div style="font-size:16px;font-weight:800;color:${col};margin-top:4px">${r.id}</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.4)">${t?.label||""}</div>
          <div style="font-size:22px;font-weight:800;margin-top:6px">${r.total}</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3)">combined pts</div>
        </div>`;
      }).join("")}
    </div>
    <div class="label-xs" style="margin-bottom:8px">OA Notes &amp; Script</div>
    <textarea id="oa-textarea" oninput="S.oaNotes=this.value" placeholder="Write your OA here — structure, key comparisons, advice for teams…">${esc(S.oaNotes)}</textarea>
    <div style="margin-top:16px;background:rgba(251,191,36,0.05);border:1px solid rgba(251,191,36,0.15);border-radius:10px;padding:14px">
      <div style="font-size:11px;color:#fbbf24;font-weight:700;margin-bottom:8px">📋 OA CHECKLIST</div>
      ${[
        "Announce ranking clearly at the start",
        "Cover ALL pairwise comparisons (min 6 for BP)",
        "Identify specific arguments — avoid vague adjectives",
        "Explain why stronger arguments beat weaker ones",
        "Separate advice from decision reasons",
        "Note any split decisions and which comparisons were voted on",
        "Invite teams for post-round feedback",
        "Stay within 10–15 minutes",
      ].map(item=>`<div style="display:flex;gap:8px;margin-bottom:4px;font-size:12px;color:rgba(255,255,255,0.6)"><span style="color:#fbbf24">□</span>${item}</div>`).join("")}

// MUTATION HANDLERS (called from inline event handlers)
// ══════════════════════════════════════════════════════════════════════════════
function updateTeamField(teamId,field,value){
  S.teams[teamId][field]=value;
  // no full re-render needed for textarea inputs
}
function updateSpeakerField(teamId,idx,field,value){
  S.teams[teamId].speakers[idx][field]=value;
}
function updateSpeakerScore(teamId,idx,value){
  const score=Math.max(50,Math.min(100,Number(value)));
  S.teams[teamId].speakers[idx].score=score;
  // update both sibling inputs + score display without full re-render
  const card=document.querySelectorAll(`#content .speaker-card`);
  // Just re-render the active team panel section
  partialRenderTeams();
}
function partialRenderTeams(){
  const ids=teamIds();
  const rankings=computeRankings(S.teams);
  const content=document.getElementById("content");
  if(!content||S.judgeTab!=="teams") return;
  content.innerHTML=renderTeamsTab(ids,rankings);
}
function toggleScale(spId){
  S.showScale[spId]=!S.showScale[spId];
  partialRenderTeams();
}
function addPOI(teamId,idx,type){
  if(type==="offered") S.teams[teamId].speakers[idx].pois_offered.push("offered");
  else S.teams[teamId].speakers[idx].pois_taken.push(type);
  partialRenderTeams();
}
function clearPOIs(teamId,idx){
  S.teams[teamId].speakers[idx].pois_taken=[];
  S.teams[teamId].speakers[idx].pois_offered=[];
  partialRenderTeams();
}
function addArgument(teamId){
  S.teams[teamId].arguments.push({id:uid(),text:"",strength:"medium",tag:"Practical",status:"standing"});
  partialRenderTeams();
}
function updateArgField(teamId,argId,field,value){
  const arg=S.teams[teamId].arguments.find(a=>a.id===argId);
  if(arg) { arg[field]=value; if(field!=="text") partialRenderTeams(); }
}
function deleteArgument(teamId,argId){
  S.teams[teamId].arguments=S.teams[teamId].arguments.filter(a=>a.id!==argId);
  partialRenderTeams();
}
function updateClash(key,field,value){
  if(!S.clashes[key]) S.clashes[key]={notes:"",winner:null,confidence:2};
  S.clashes[key][field]=value;
  // re-render clash tab if active for winner buttons
  if(S.judgeTab==="clash"){ const c=document.getElementById("content"); if(c){ const ids=teamIds(); const rankings=computeRankings(S.teams); c.innerHTML=renderClashTab(ids,rankings); } }
}
function updateContradictions(teamId,value){ S.teams[teamId].contradictions=value.split("\n"); }

function generateOATemplate(){
  const rankings=computeRankings(S.teams);
  const sorted=[...rankings].sort((a,b)=>a.autoRank-b.autoRank);
  let t=`=== OA STRUCTURE ===\n\nRANKING:\n`;
  sorted.forEach((r,i)=>{ const tm=S.teams[r.id]; t+=`  ${RANK_EMOJI[i]} #${i+1}: ${r.id} (${tm?.label}) — Σ${r.total}\n`; });
  t+=`\n`;
  if(S.mode==="BP"){
    t+=`PAIRWISE COMPARISONS:\n  [ ] OG vs OO — top half\n  [ ] CG vs CO — bottom half\n  [ ] OG vs CG — gov bench\n  [ ] OO vs CO — opp bench\n  [ ] OG vs CO — diagonal\n  [ ] OO vs CG — diagonal\n\n`;
  } else { t+=`PAIRWISE COMPARISON:\n  [ ] GOV vs OPP\n\n`; }
  t+=`JUSTIFICATION:\n`;
  sorted.forEach((r,i)=>{ const tm=S.teams[r.id]; t+=`\n#${i+1} ${r.id} — ${tm?.label}\n`; const args=tm?.arguments||[]; if(args.length>0) t+=`   Args: ${args.map(a=>a.text.slice(0,60)).join("; ")}\n`; t+=`   [Your reasoning…]\n`; });
  t+=`\n\nGENERAL ADVICE:\n  [Advice separated from decision reasons]\n`;
  S.oaNotes=t;
  const ta=document.getElementById("oa-textarea");
  if(ta) ta.value=t;
}

// FLOW VIEW (horizontal speech-by-speech grid)
// ══════════════════════════════════════════════════════════════════════════════
function renderFlowTab(ids){
  const speeches=[];
  if(S.mode==="BP"){
    speeches.push({teamId:"OG",spIdx:0,label:"Prime Minister"});
    speeches.push({teamId:"OO",spIdx:0,label:"Leader of Opp"});
    speeches.push({teamId:"OG",spIdx:1,label:"Dep. PM"});
    speeches.push({teamId:"OO",spIdx:1,label:"Dep. LO"});
    speeches.push({teamId:"CG",spIdx:0,label:"Member Gov"});
    speeches.push({teamId:"CO",spIdx:0,label:"Member Opp"});
    speeches.push({teamId:"CG",spIdx:1,label:"Gov Whip"});
    speeches.push({teamId:"CO",spIdx:1,label:"Opp Whip"});
  } else {
    speeches.push({teamId:"GOV",spIdx:0,label:"Prime Minister"});
    speeches.push({teamId:"OPP",spIdx:0,label:"Leader of Opp"});
    speeches.push({teamId:"GOV",spIdx:1,label:"Dep. PM"});
    speeches.push({teamId:"OPP",spIdx:1,label:"Dep. LO"});
    speeches.push({teamId:"GOV",spIdx:2,label:"Gov Whip"});

  return `

    <div style="font-size:12px;color:var(--text3);margin-bottom:12px">Track each speech left-to-right as the debate unfolds. Notes here sync to Team Notes.</div>
    <div class="flow-grid" style="grid-template-columns:repeat(${cols},minmax(200px,1fr));min-width:${cols*200}px">
      ${speeches.map((sp,i)=>{
        const col=TEAM_COLORS[sp.teamId];
        const spData=S.teams[sp.teamId]?.speakers[sp.spIdx];
        const bench=S.teams[sp.teamId]?.bench==="gov"?"Gov":"Opp";
        return `
        <div class="flow-col" style="border-top:3px solid ${col}">
          <div class="flow-col-header" style="border-top:none">
            <div style="font-size:10px;font-weight:800;color:${col};letter-spacing:.5px">${sp.teamId}</div>
            <div style="font-size:12px;font-weight:700;color:var(--text);margin-top:1px">${sp.label}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px">${spData?.name||"Speaker "+(sp.spIdx+1)} · ${spData?.score||75}pts</div>
          </div>
          <textarea class="flow-note" rows="8"
            oninput="updateFlowNote('${sp.teamId}',${sp.spIdx},this.value)"
            placeholder="Notes on this speech…\n\n• Key arguments\n• POIs\n• Style observations"
          >${esc(spData?.flowNotes||"")}</textarea>
          <div style="padding:8px 10px;border-bottom:1px solid var(--border)">
            <div style="font-size:10px;color:var(--text3);margin-bottom:4px">Arguments in this speech:</div>
            ${(S.teams[sp.teamId]?.arguments||[]).map(a=>`
              <div class="flow-arg-chip" style="background:${TEAM_COLORS[sp.teamId]}15;color:${TEAM_COLORS[sp.teamId]};border-color:${TEAM_COLORS[sp.teamId]}30">
                <span style="font-size:9px">${a.strength==="strong"?"💪":a.strength==="weak"?"⚠":"⚡"}</span>
                <span style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.text.slice(0,30)||"(no text)")}</span>
                <span style="font-size:9px;opacity:.6">${a.status==="rebutted"?"[R]":a.status==="conceded"?"[C]":""}</span>
              </div>`).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
    <!-- Quick note area at bottom of flow -->
    ${S.quickNotes.length?`
    <div style="margin-top:16px">
      <div class="label-xs" style="margin-bottom:8px">Quick-captured notes</div>
      ${S.quickNotes.map(n=>{
        const col=TEAM_COLORS[n.teamId]||"#818cf8";
        const ago=Math.round((Date.now()-n.ts)/60000);
        return `<div class="quick-note-item">
          <span class="quick-note-team" style="background:${col}20;color:${col}">${n.teamId||"?"}</span>
          <span style="flex:1;color:var(--text)">${esc(n.text)}</span>
          <span style="font-size:10px;color:var(--text3)">${ago<1?"now":ago+"m"}</span>
          <button onclick="deleteQuickNote('${n.id}')" style="background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;padding:0">×</button>
        </div>`;
      }).join("")}
    </div>`:""}
  </div>`;
}

function renderQuickHotbar(){
