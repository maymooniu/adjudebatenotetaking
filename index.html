<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjudicator — Debate Judge Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#0a0a0f;color:#fff;font-family:'DM Sans','Segoe UI',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
input,textarea,select,button{font-family:inherit}
textarea::placeholder,input::placeholder{color:rgba(255,255,255,0.2)}
select option{background:#1a1a2e;color:#fff}
button{cursor:pointer}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.fade-in{animation:fadeIn 0.4s ease both}
.slide-in{animation:slideIn 0.25s ease both}
#app{min-height:100vh}

/* ── reusable atoms ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px}
.label-xs{font-size:11px;color:rgba(255,255,255,0.35);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.note-textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:12px;padding:10px 12px;resize:vertical;min-height:60px;outline:none;line-height:1.6;font-family:'DM Sans',sans-serif}
.note-textarea:focus{border-color:rgba(129,140,248,0.4)}
.btn{padding:6px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);font-size:12px;font-weight:600;transition:all .15s}
.btn:hover{background:rgba(255,255,255,0.09);color:#fff}
.btn-primary{background:rgba(129,140,248,0.18);color:#818cf8;border-color:rgba(129,140,248,0.35)}
.btn-primary:hover{background:rgba(129,140,248,0.28)}
.btn-success{background:rgba(34,197,94,0.12);color:#4ade80;border-color:rgba(34,197,94,0.25)}
.btn-danger{background:rgba(239,68,68,0.1);color:#f87171;border-color:rgba(239,68,68,0.2)}

/* ── timer ── */
#timer-widget{position:fixed;bottom:24px;right:24px;z-index:9999;width:248px;background:rgba(6,6,14,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px 20px;backdrop-filter:blur(16px);box-shadow:0 8px 40px rgba(0,0,0,0.6);transition:border-color .3s}
#timer-widget.over{border-color:#ef4444;animation:blink .9s step-end infinite}
#timer-mini{position:fixed;bottom:24px;right:24px;z-index:9999;background:rgba(6,6,14,0.96);border-radius:40px;padding:8px 18px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
#timer-mini.over{background:#ef4444;animation:blink .9s step-end infinite}
#timer-display{font-family:'DM Mono',monospace;font-size:36px;font-weight:700;letter-spacing:2px;text-align:center;line-height:1;transition:color .3s}
#timer-bar-track{background:rgba(255,255,255,0.1);border-radius:4px;height:4px;margin:10px 0}
#timer-bar-fill{height:100%;border-radius:4px;transition:width .6s linear,background .3s}
.timer-phase-btn{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid;cursor:pointer;transition:all .15s}

/* ── top bar ── */
#topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06)}
#topbar-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:10px;height:54px;padding:0 16px}
#motion-bar{max-width:1400px;margin:0 auto;padding:0 16px 8px}
#motion-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:rgba(255,255,255,0.8);font-size:13px;padding:6px 12px;outline:none;font-style:italic}
#motion-input:focus{border-color:rgba(129,140,248,0.3)}
#title-input{background:transparent;border:none;color:#fff;font-size:14px;font-weight:600;outline:none;flex:1;min-width:0}
#round-input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:12px;padding:4px 10px;width:80px;outline:none}
.tab-bar{max-width:1400px;margin:0 auto;display:flex;border-top:1px solid rgba(255,255,255,0.05);padding:0 16px}
.main-tab{padding:10px 16px;background:none;border:none;color:rgba(255,255,255,0.35);border-bottom:2px solid transparent;font-size:12px;font-weight:600;transition:all .15s}
.main-tab.active{color:#818cf8;border-bottom-color:#818cf8}
.main-tab:hover{color:rgba(255,255,255,0.7)}

/* ── content ── */
#content{max-width:1400px;margin:0 auto;padding:20px 16px 140px}

/* ── team tab selector ── */
.team-tab-btn{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:500;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);transition:all .15s;white-space:nowrap}
.team-tab-btn.active{font-weight:700}

/* ── speaker card ── */
.speaker-card{background:rgba(255,255,255,0.03);border-radius:10px;padding:14px;margin-bottom:10px;border-left:3px solid;border-top:1px solid rgba(255,255,255,0.06);border-right:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06)}
.score-display{font-size:24px;font-weight:800;line-height:1}
.poi-btn{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;border:1px solid;cursor:pointer;transition:all .15s}
.poi-btn:hover{opacity:.8}

/* ── argument card ── */
.arg-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px;margin-bottom:8px}
.arg-select{font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.15)}
.arg-textarea{width:100%;background:transparent;border:none;color:#fff;font-size:13px;resize:none;outline:none;line-height:1.5;min-height:36px;font-family:'DM Sans',sans-serif}

/* ── overview row ── */
#score-overview{margin-top:20px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:14px;padding:16px}

/* ── clash ── */
.clash-textarea{width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:8px;color:#fff;font-size:12px;padding:8px 10px;resize:vertical;min-height:52px;outline:none;line-height:1.5;font-family:'DM Sans',sans-serif}
.clash-textarea:focus{border-color:rgba(129,140,248,0.3)}
.contr-textarea{width:100%;background:rgba(239,68,68,0.04);border:1px solid rgba(239,68,68,0.1);border-radius:8px;color:#fff;font-size:12px;padding:8px 10px;resize:vertical;min-height:48px;outline:none;line-height:1.5;font-family:'DM Sans',sans-serif}

/* ── OA ── */
#oa-textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(129,140,248,0.2);border-radius:10px;color:#fff;font-size:13px;padding:14px 16px;resize:vertical;min-height:300px;outline:none;line-height:1.7;font-family:'DM Mono',monospace}
#oa-textarea:focus{border-color:rgba(129,140,248,0.45)}

/* ── saved list ── */
.saved-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start;transition:border-color .15s}
.saved-card:hover{border-color:rgba(255,255,255,0.14)}

/* ── scale popup ── */
.scale-popup{background:rgba(0,0,0,0.5);border-radius:8px;padding:10px;max-height:160px;overflow-y:auto;font-size:11px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.07)}

/* ── home ── */
.mode-card{padding:24px 20px;border-radius:16px;cursor:pointer;text-align:left;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);transition:all .2s;outline:none}
.mode-card:hover{background:rgba(129,140,248,0.1);border-color:rgba(129,140,248,0.4)}

/* ── OA rank cards ── */
.oa-rank-card{border-radius:10px;padding:10px 12px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════════════════════
const SUPABASE_URL = "https://wflbkylzmedfvpbtosgg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Xx69UKocPcHChda3ea76JA_mguKTk4Z";

async function supaFetch(path, opts = {}) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        Prefer: opts.prefer || "return=representation",
        ...(opts.extraHeaders || {})
      },
      method: opts.method || "GET",
      body: opts.body
    });
    if (!res.ok) throw new Error(await res.text());
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  } catch(e) {
    console.warn("Supabase:", e.message);
    return null;
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════════════════════════
const BP_TEAMS = [
  { id:"OG", label:"Opening Government",  abbr:"OG", bench:"gov", half:"opening" },
  { id:"OO", label:"Opening Opposition",  abbr:"OO", bench:"opp", half:"opening" },
  { id:"CG", label:"Closing Government",  abbr:"CG", bench:"gov", half:"closing" },
  { id:"CO", label:"Closing Opposition",  abbr:"CO", bench:"opp", half:"closing" },
];
const BP_ROLES = {
  OG:["Prime Minister","Deputy Prime Minister"],
  OO:["Leader of Opposition","Deputy Leader of Opposition"],
  CG:["Member of Government","Government Whip"],
  CO:["Member of Opposition","Opposition Whip"],
};
const AP_TEAMS = [
  { id:"GOV", label:"Government",  abbr:"GOV", bench:"gov", half:"opening" },
  { id:"OPP", label:"Opposition",  abbr:"OPP", bench:"opp", half:"opening" },
];
const AP_ROLES = {
  GOV:["Prime Minister","Deputy Prime Minister","Government Whip"],
  OPP:["Leader of Opposition","Deputy Leader of Opposition","Opposition Whip"],
};
const TEAM_COLORS = {
  OG:"#818cf8", OO:"#fb923c", CG:"#4ade80", CO:"#f472b6",
  GOV:"#818cf8", OPP:"#fb923c"
};
const ARGUMENT_TAGS = ["Economy","Rights","Democracy","Environment","Security","Health","Social","Practical","Principled","Empirical"];
const SPEAKER_SCALE = [
  {r:"95–100",d:"Plausibly one of the best speeches ever given"},
  {r:"92–94", d:"Incredible — undoubtedly among best at competition"},
  {r:"89–91", d:"Brilliant — demands extremely sophisticated responses"},
  {r:"86–88", d:"Highly compelling, no logical gaps"},
  {r:"83–85", d:"Addresses core issues with strong explanations"},
  {r:"79–82", d:"Relevant, well-made, may be vulnerable to good responses"},
  {r:"76–78", d:"Almost exclusively relevant, clear to follow"},
  {r:"73–75", d:"Logical but simplistic, vulnerable to competent responses"},
  {r:"70–72", d:"Frequently relevant, regular significant logical gaps"},
  {r:"67–69", d:"Generally relevant, significant logical gaps throughout"},
  {r:"64–66", d:"Some relevant arguments with significant logical gaps"},
  {r:"61–63", d:"Some relevant claims, frequently unclear"},
  {r:"58–60", d:"Occasionally relevant, hard to follow"},
  {r:"55–57", d:"One or two marginally relevant claims"},
  {r:"50–54", d:"Content not relevant, very hard to follow"},
];
const RANK_EMOJI = ["🥇","🥈","🥉","4️⃣"];

// ══════════════════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════════════════
let S = {
  view: "home",       // home | judge | saved
  mode: "BP",
  sessionTitle: "",
  motion: "",
  round: "",
  teams: {},
  oaNotes: "",
  clashes: {},
  savedNotes: [],
  activeTeamTab: "OG",
  judgeTab: "teams",  // teams | clash | oa
  editingId: null,
  saving: false,
  saveMsg: "",
  showScale: {},      // speakerId -> bool
  timerPhase: "prep",
  timerRunning: false,
  timerElapsed: 0,
  timerMinimized: false,
};
let timerInterval = null;

// ══════════════════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════════════════
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function fmtTime(s){ const m=Math.floor(s/60),sc=s%60; return `${m}:${sc.toString().padStart(2,"0")}`; }
function esc(str){ return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function defaultBPSession(){
  const teams={};
  BP_TEAMS.forEach(t=>{
    teams[t.id]={
      id:t.id, label:t.label, abbr:t.abbr, bench:t.bench, half:t.half,
      speakers:BP_ROLES[t.id].map((role,i)=>({
        id:`${t.id}_s${i}`, role, name:"", score:75, notes:"",
        pois_taken:[], pois_offered:[],
      })),
      teamNotes:"", arguments:[], contradictions:[], extension:"", rank:null,
    };
  });
  return teams;
}
function defaultAPSession(){
  const teams={};
  AP_TEAMS.forEach(t=>{
    teams[t.id]={
      id:t.id, label:t.label, abbr:t.abbr, bench:t.bench, half:t.half,
      speakers:AP_ROLES[t.id].map((role,i)=>({
        id:`${t.id}_s${i}`, role, name:"", score:75, notes:"",
        pois_taken:[], pois_offered:[],
      })),
      teamNotes:"", arguments:[], contradictions:[], rank:null,
    };
  });
  return teams;
}
function computeRankings(teams){
  const entries=Object.values(teams).map(t=>({
    id:t.id,
    total:t.speakers.reduce((s,sp)=>s+Number(sp.score||0),0),
  }));
  return [...entries].sort((a,b)=>b.total-a.total).map((e,i)=>({...e,autoRank:i+1}));
}
function teamIds(){ return S.mode==="BP"?BP_TEAMS.map(t=>t.id):AP_TEAMS.map(t=>t.id); }

function loadSaved(){
  try{ S.savedNotes=JSON.parse(localStorage.getItem("adj_sessions")||"[]"); }
  catch(e){ S.savedNotes=[]; }
}
function persistSaved(){
  localStorage.setItem("adj_sessions",JSON.stringify(S.savedNotes));
}

// ══════════════════════════════════════════════════════════════════════════════
// TIMER
// ══════════════════════════════════════════════════════════════════════════════
function timerPrepMax(){ return S.mode==="BP"?15*60:30*60; }
const SPEAKER_MAX=7*60+15;
function timerLimit(){ return S.timerPhase==="prep"?timerPrepMax():SPEAKER_MAX; }
function timerIsOver(){ return S.timerElapsed>timerLimit(); }
function timerIsWarning(){ return S.timerPhase==="speaker"&&S.timerElapsed>=6*60&&!timerIsOver(); }
function timerColor(){
  if(timerIsOver()) return "#ef4444";
  if(timerIsWarning()) return "#f59e0b";
  return "#22c55e";
}
function startTimerInterval(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    S.timerElapsed++;
    renderTimer();
  },1000);
}
function stopTimerInterval(){ clearInterval(timerInterval); }

function renderTimer(){
  const over=timerIsOver(), warn=timerIsWarning(), col=timerColor();
  const pct=Math.min((S.timerElapsed/timerLimit())*100,100);

  if(S.timerMinimized){
    document.getElementById("timer-widget")&&document.getElementById("timer-widget").remove();
    let mini=document.getElementById("timer-mini");
    if(!mini){
      mini=document.createElement("div");
      mini.id="timer-mini";
      mini.onclick=()=>{ S.timerMinimized=false; renderTimer(); };
      document.body.appendChild(mini);
    }
    mini.className="timer-mini"+(over?" over":"");
    mini.style.display="flex";
    mini.innerHTML=`<span style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:${over?"#fff":col}">${fmtTime(S.timerElapsed)}</span><span style="font-size:10px;color:rgba(255,255,255,0.45)">tap to expand</span>`;
    return;
  }
  document.getElementById("timer-mini")&&document.getElementById("timer-mini").remove();

  let w=document.getElementById("timer-widget");
  if(!w){
    w=document.createElement("div");
    w.id="timer-widget";
    document.body.appendChild(w);
  }
  w.className=""+(over?" over":"");
  w.style.borderColor=over?"#ef4444":"rgba(255,255,255,0.1)";

  const phaseLabel=S.timerPhase==="prep"
    ?`${S.mode} prep — ${S.mode==="BP"?"15:00":"30:00"} limit`
    :"7:15 limit · POI 1:00–6:00";

  w.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="display:flex;gap:4px">
        ${["prep","speaker"].map(p=>{
          const active=S.timerPhase===p;
          return `<button class="timer-phase-btn" onclick="timerSetPhase('${p}')" style="background:${active?col:"transparent"};color:${active?"#000":"rgba(255,255,255,0.45)"};border-color:${active?col:"rgba(255,255,255,0.15)"}">${p==="prep"?"PREP":"SPEAKER"}</button>`;
        }).join("")}
      </div>
      <button onclick="S.timerMinimized=true;renderTimer()" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:18px;line-height:1;padding:0">–</button>
    </div>
    <div id="timer-display" style="color:${col};animation:${over?"blink .9s step-end infinite":"none"}">${fmtTime(S.timerElapsed)}</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.35);text-align:center;margin-top:4px">${phaseLabel}</div>
    <div id="timer-bar-track"><div id="timer-bar-fill" style="width:${pct}%;background:${col}"></div></div>
    ${S.timerPhase==="speaker"?`<div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:8px"><span>1:00 open</span><span>6:00 close</span><span>7:15 stop</span></div>`:""}
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="timerToggle()" style="flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:13px;background:${S.timerRunning?"#ef4444":col};color:#000;border:none;transition:background .2s">${S.timerRunning?"⏸ PAUSE":"▶ START"}</button>
      <button onclick="timerReset()" style="padding:8px 14px;border-radius:8px;background:rgba(255,255,255,0.1);color:#fff;border:none;font-size:16px">↺</button>
    </div>
  `;
}
function timerSetPhase(p){ S.timerPhase=p; timerReset(); }
function timerToggle(){
  S.timerRunning=!S.timerRunning;
  if(S.timerRunning) startTimerInterval(); else stopTimerInterval();
  renderTimer();
}
function timerReset(){ S.timerElapsed=0; S.timerRunning=false; stopTimerInterval(); renderTimer(); }

// ══════════════════════════════════════════════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════════════════════════════════════════════
function render(){
  const app=document.getElementById("app");
  if(S.view==="home") { app.innerHTML=renderHome(); bindHome(); }
  else if(S.view==="saved") { app.innerHTML=renderSaved(); bindSaved(); }
  else if(S.view==="judge") { app.innerHTML=renderJudge(); bindJudge(); }
  // re-attach timer
  if(S.view==="judge") renderTimer();
  else { document.getElementById("timer-widget")&&document.getElementById("timer-widget").remove(); document.getElementById("timer-mini")&&document.getElementById("timer-mini").remove(); }
}

// ══════════════════════════════════════════════════════════════════════════════
// HOME
// ══════════════════════════════════════════════════════════════════════════════
function renderHome(){
  return `
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px">
    <div class="fade-in" style="text-align:center;max-width:560px;width:100%">
      <div style="font-size:52px;margin-bottom:14px">⚖️</div>
      <h1 style="font-size:42px;font-weight:800;color:#fff;letter-spacing:-1.5px;margin-bottom:10px">Adjudicator</h1>
      <p style="font-size:15px;color:rgba(255,255,255,0.4);margin-bottom:40px;line-height:1.7">Professional note-taking &amp; judging assistant<br>for BP and AP debate competitions</p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">
        <button class="mode-card" id="btn-bp">
          <div style="font-size:30px;margin-bottom:10px">🏛️</div>
          <div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:4px">British Parliamentary</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:8px">4 teams · 8 speeches · WUDC format</div>
          <div style="font-size:11px;color:#818cf8;font-weight:700">OG · OO · CG · CO</div>
        </button>
        <button class="mode-card" id="btn-ap">
          <div style="font-size:30px;margin-bottom:10px">🏟️</div>
          <div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:4px">Asian Parliamentary</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:8px">2 teams · 6 speeches · AP format</div>
          <div style="font-size:11px;color:#fb923c;font-weight:700">Government · Opposition</div>

function bindHome(){
  document.getElementById("btn-bp").onclick=()=>startNewSession("BP");

// ══════════════════════════════════════════════════════════════════════════════
// START / LOAD SESSION
// ══════════════════════════════════════════════════════════════════════════════
function startNewSession(mode){
  S.mode=mode;
  S.teams=mode==="BP"?defaultBPSession():defaultAPSession();
  S.oaNotes=""; S.clashes={}; S.editingId=null;
  S.sessionTitle=`${mode} Session — ${new Date().toLocaleDateString()}`;
  S.motion=""; S.round="";
  S.activeTeamTab=mode==="BP"?"OG":"GOV";
  S.judgeTab="teams";
  S.showScale={};
  S.timerPhase="prep"; timerReset();
  S.view="judge";
  render();
}
function loadSession(note){
  S.mode=note.mode; S.teams=note.teams; S.oaNotes=note.oaNotes||"";
  S.clashes=note.clashes||{}; S.sessionTitle=note.title;
  S.motion=note.motion||""; S.round=note.round||""; S.editingId=note.id;
  S.activeTeamTab=note.mode==="BP"?"OG":"GOV";
  S.judgeTab="teams"; S.showScale={};
  S.timerPhase="prep"; timerReset();
  S.view="judge";
  render();
}

// ══════════════════════════════════════════════════════════════════════════════
function renderSaved(){
  const notes=S.savedNotes;
  return `
  <div style="min-height:100vh;padding:24px">

      <button onclick="S.view='home';render()" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:14px;margin-bottom:20px;padding:0">← Back to home</button>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <div>
          <div style="font-size:22px;font-weight:800">Saved Sessions</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.35);margin-top:2px">${notes.length} session${notes.length!==1?"s":""} saved</div>
        </div>
        <button class="btn btn-primary" onclick="S.view='home';render()">+ New Session</button>
      </div>
      ${notes.length===0?`<div style="text-align:center;padding:60px 0;color:rgba(255,255,255,0.25)"><div style="font-size:48px;margin-bottom:12px">📋</div><div style="font-size:14px">No saved sessions yet</div></div>`:""}
      <div id="saved-list" style="display:flex;flex-direction:column;gap:10px">

      </div>

}
function renderSavedCard(note){
  const date=new Date(note.savedAt||note.created_at);
  const rankings=note.rankings||[];
  return `
  <div class="saved-card">
    <div style="flex:1;min-width:0">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">${esc(note.title)}</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:6px">${note.mode} · ${date.toLocaleDateString()} ${date.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
      ${note.motion?`<div style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:6px;font-style:italic">"${esc(note.motion)}"</div>`:""}
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${rankings.slice(0,4).map((r,i)=>`<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:${TEAM_COLORS[r.id]||"#818cf8"}18;color:${TEAM_COLORS[r.id]||"#818cf8"};font-weight:700">#${i+1} ${esc(r.id)}</span>`).join("")}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
      <button class="btn btn-primary" onclick="openSaved('${esc(note.id)}')">Open</button>
      <button class="btn btn-success" onclick="exportSession('${esc(note.id)}')">↓ Export</button>
      <button class="btn btn-danger" onclick="deleteSession('${esc(note.id)}')">Delete</button>
    </div>
  </div>`;
}
function bindSaved(){}

function openSaved(id){
  const note=S.savedNotes.find(n=>n.id===id);
  if(note) loadSession(note);
}
function exportSession(id){
  const note=S.savedNotes.find(n=>n.id===id); if(!note) return;
  const blob=new Blob([JSON.stringify(note,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=`${note.title}.json`; a.click();
  URL.revokeObjectURL(url);
}
function deleteSession(id){
  if(!confirm("Delete this session permanently?")) return;
  S.savedNotes=S.savedNotes.filter(n=>n.id!==id);
  persistSaved();
  render();
}

function renderSpeakerCard(sp,idx,teamId,col){

  const showScale=S.showScale[sp.id]||false;
  const poisTaken=sp.pois_taken||[];

  const countOf=(type)=>type==="offered"?poisOffered.length:poisTaken.filter(p=>p===type).length;
  return `
  <div class="speaker-card" style="border-left-color:${col}">
    <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px">
      <div style="flex:1">
        <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:3px;font-weight:700;letter-spacing:.5px">${sp.role.toUpperCase()}</div>
        <input value="${esc(sp.name)}" placeholder="Speaker name…" oninput="updateSpeakerField('${teamId}',${idx},'name',this.value)"
          style="background:transparent;border:none;color:#fff;font-size:14px;font-weight:600;outline:none;width:100%">
      </div>
      <div style="text-align:center;min-width:60px">
        <div class="score-display" style="color:${scoreColor}">${score}</div>

    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <span style="font-size:11px;color:rgba(255,255,255,0.4);min-width:36px">Score</span>
      <input type="range" min="50" max="100" value="${score}" oninput="updateSpeakerScore('${teamId}',${idx},this.value)"
        style="flex:1;accent-color:${scoreColor}">
      <input type="number" min="50" max="100" value="${score}" oninput="updateSpeakerScore('${teamId}',${idx},this.value)"
        style="width:48px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:#fff;font-size:12px;text-align:center;padding:2px 4px;outline:none">
      <button onclick="toggleScale('${sp.id}')" style="background:none;border:none;color:rgba(255,255,255,0.3);font-size:13px;padding:0">?</button>
    </div>
    ${showScale?`<div class="scale-popup">${SPEAKER_SCALE.map(s=>`<div style="display:flex;gap:8px;margin-bottom:4px;color:rgba(255,255,255,0.7)"><span style="min-width:48px;color:#f59e0b;font-weight:700">${s.r}</span><span>${s.d}</span></div>`).join("")}</div>`:""}

      <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:4px">Speaker notes</div>

    </div>
    <div>
      <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:6px">POI tracking</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${[
          {type:"taken_excellent",label:"✓✓ Excellent",col:"#22c55e"},
          {type:"taken_good",label:"✓ Good",col:"#86efac"},
          {type:"taken_poor",label:"~ Poor",col:"#f59e0b"},
          {type:"refused",label:"✗ Refused",col:"#ef4444"},
          {type:"offered",label:"→ Offered",col:"#60a5fa"},
        ].map(({type,label,col:pc})=>{
          const cnt=countOf(type);
          return `<button class="poi-btn" style="background:${pc}20;color:${pc};border-color:${pc}40" onclick="addPOI('${teamId}',${idx},'${type}')">${label}${cnt>0?" ("+cnt+")":""}</button>`;

      </div>
    </div>
  </div>`;
}

// ── CLASH TAB ──
function renderClashTab(ids,rankings){
  const pairs=[];
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) pairs.push([ids[i],ids[j]]);
  return `
  <div class="slide-in">
    <div class="label-xs" style="margin-bottom:10px">Pairwise Clash Notes</div>
    ${pairs.map(([a,b])=>{
      const key=[a,b].sort().join("_vs_");
      return `
      <div style="margin-bottom:10px">
        <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:4px">
          <span style="font-weight:700;color:${TEAM_COLORS[a]}">${a}</span>
          <span style="color:rgba(255,255,255,0.25)"> vs </span>
          <span style="font-weight:700;color:${TEAM_COLORS[b]}">${b}</span>
        </div>
        <textarea class="clash-textarea" oninput="updateClash('${key}',this.value)" placeholder="Who won the ${a} vs ${b} clash? Why?">${esc(S.clashes[key]||"")}</textarea>
      </div>`;
    }).join("")}

    <div style="margin-top:24px">
      <div class="label-xs" style="margin-bottom:10px">Contradiction Tracker</div>
      ${ids.map(tid=>{
        const t=S.teams[tid], col=TEAM_COLORS[tid];
        const val=(t.contradictions||[]).join("\n");
        return `
        <div style="margin-bottom:10px;display:flex;gap:10px;align-items:flex-start">
          <div style="min-width:36px;height:36px;border-radius:8px;background:${col}20;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${col};border:1px solid ${col}30;flex-shrink:0">${tid}</div>
          <textarea class="contr-textarea" oninput="updateContradictions('${tid}',this.value)" placeholder="Contradictions noted in ${tid}?">${esc(val)}</textarea>
        </div>`;
      }).join("")}
    </div>

    ${S.mode==="BP"?renderBenchAnalysis(rankings):""}
  </div>`;
}
function renderBenchAnalysis(rankings){
  const benches=[
    {label:"Government Bench",ids:["OG","CG"],col:"#818cf8"},
    {label:"Opposition Bench",ids:["OO","CO"],col:"#fb923c"},
    {label:"Opening Half",ids:["OG","OO"],col:"#4ade80"},
    {label:"Closing Half",ids:["CG","CO"],col:"#f472b6"},
  ];
  return `
  <div style="margin-top:24px">
    <div class="label-xs" style="margin-bottom:10px">Bench &amp; Half Analysis</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${benches.map(b=>{
        const tots=b.ids.map(id=>S.teams[id]?.speakers.reduce((s,sp)=>s+Number(sp.score||0),0)||0);
        const winner=tots[0]>tots[1]?b.ids[0]:tots[1]>tots[0]?b.ids[1]:"Tied";
        return `
        <div style="background:${b.col}08;border:1px solid ${b.col}20;border-radius:10px;padding:12px">
          <div style="font-size:11px;color:${b.col};font-weight:700;margin-bottom:8px">${b.label}</div>
          ${b.ids.map((id,i)=>`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:rgba(255,255,255,0.5)">${id}</span><span style="font-weight:700;color:${winner===id?b.col:"rgba(255,255,255,0.7)"}">${tots[i]}</span></div>`).join("")}
          <div style="margin-top:8px;font-size:11px;color:${b.col};font-weight:600">${winner==="Tied"?"⚖️ Tied":"→ "+winner+" leads"}</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

// ── OA TAB ──
function renderOATab(rankings){
  const sorted=[...rankings].sort((a,b)=>a.autoRank-b.autoRank);
  return `
  <div class="slide-in">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:13px;font-weight:600">OA Preparation &amp; Ranking Summary</div>
      <button class="btn btn-primary" onclick="generateOATemplate()">✨ Auto-generate template</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:20px">
      ${sorted.map((r,i)=>{
        const t=S.teams[r.id], col=TEAM_COLORS[r.id];
        return `<div class="oa-rank-card" style="background:${col}10;border:1px solid ${col}30">
          <div style="font-size:20px">${RANK_EMOJI[i]}</div>
          <div style="font-size:16px;font-weight:800;color:${col};margin-top:4px">${r.id}</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.4)">${t?.label||""}</div>
          <div style="font-size:22px;font-weight:800;margin-top:6px">${r.total}</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3)">combined pts</div>
        </div>`;
      }).join("")}
    </div>
    <div class="label-xs" style="margin-bottom:8px">OA Notes &amp; Script</div>
    <textarea id="oa-textarea" oninput="S.oaNotes=this.value" placeholder="Write your OA here — structure, key comparisons, advice for teams…">${esc(S.oaNotes)}</textarea>
    <div style="margin-top:16px;background:rgba(251,191,36,0.05);border:1px solid rgba(251,191,36,0.15);border-radius:10px;padding:14px">
      <div style="font-size:11px;color:#fbbf24;font-weight:700;margin-bottom:8px">📋 OA CHECKLIST</div>
      ${[
        "Announce ranking clearly at the start",
        "Cover ALL pairwise comparisons (min 6 for BP)",
        "Identify specific arguments — avoid vague adjectives",
        "Explain why stronger arguments beat weaker ones",
        "Separate advice from decision reasons",
        "Note any split decisions and which comparisons were voted on",
        "Invite teams for post-round feedback",
        "Stay within 10–15 minutes",
      ].map(item=>`<div style="display:flex;gap:8px;margin-bottom:4px;font-size:12px;color:rgba(255,255,255,0.6)"><span style="color:#fbbf24">□</span>${item}</div>`).join("")}
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════════════════
// MUTATION HANDLERS (called from inline event handlers)
// ══════════════════════════════════════════════════════════════════════════════
function updateTeamField(teamId,field,value){
  S.teams[teamId][field]=value;
  // no full re-render needed for textarea inputs
}
function updateSpeakerField(teamId,idx,field,value){
  S.teams[teamId].speakers[idx][field]=value;
}
function updateSpeakerScore(teamId,idx,value){
  const score=Math.max(50,Math.min(100,Number(value)));
  S.teams[teamId].speakers[idx].score=score;
  // update both sibling inputs + score display without full re-render
  const card=document.querySelectorAll(`#content .speaker-card`);
  // Just re-render the active team panel section
  partialRenderTeams();
}
function partialRenderTeams(){
  const ids=teamIds();
  const rankings=computeRankings(S.teams);
  const content=document.getElementById("content");
  if(!content||S.judgeTab!=="teams") return;
  content.innerHTML=renderTeamsTab(ids,rankings);
}
function toggleScale(spId){
  S.showScale[spId]=!S.showScale[spId];
  partialRenderTeams();
}
function addPOI(teamId,idx,type){
  if(type==="offered") S.teams[teamId].speakers[idx].pois_offered.push("offered");
  else S.teams[teamId].speakers[idx].pois_taken.push(type);
  partialRenderTeams();
}
function clearPOIs(teamId,idx){
  S.teams[teamId].speakers[idx].pois_taken=[];
  S.teams[teamId].speakers[idx].pois_offered=[];
  partialRenderTeams();
}
function addArgument(teamId){
  S.teams[teamId].arguments.push({id:uid(),text:"",strength:"medium",tag:"Practical",status:"standing"});
  partialRenderTeams();
}
function updateArgField(teamId,argId,field,value){
  const arg=S.teams[teamId].arguments.find(a=>a.id===argId);
  if(arg) { arg[field]=value; if(field!=="text") partialRenderTeams(); }
}
function deleteArgument(teamId,argId){
  S.teams[teamId].arguments=S.teams[teamId].arguments.filter(a=>a.id!==argId);
  partialRenderTeams();
}
function updateClash(key,value){ S.clashes[key]=value; }
function updateContradictions(teamId,value){ S.teams[teamId].contradictions=value.split("\n"); }

function generateOATemplate(){
  const rankings=computeRankings(S.teams);
  const sorted=[...rankings].sort((a,b)=>a.autoRank-b.autoRank);
  let t=`=== OA STRUCTURE ===\n\nRANKING:\n`;
  sorted.forEach((r,i)=>{ const tm=S.teams[r.id]; t+=`  ${RANK_EMOJI[i]} #${i+1}: ${r.id} (${tm?.label}) — Σ${r.total}\n`; });
  t+=`\n`;
  if(S.mode==="BP"){
    t+=`PAIRWISE COMPARISONS:\n  [ ] OG vs OO — top half\n  [ ] CG vs CO — bottom half\n  [ ] OG vs CG — gov bench\n  [ ] OO vs CO — opp bench\n  [ ] OG vs CO — diagonal\n  [ ] OO vs CG — diagonal\n\n`;
  } else { t+=`PAIRWISE COMPARISON:\n  [ ] GOV vs OPP\n\n`; }
  t+=`JUSTIFICATION:\n`;
  sorted.forEach((r,i)=>{ const tm=S.teams[r.id]; t+=`\n#${i+1} ${r.id} — ${tm?.label}\n`; const args=tm?.arguments||[]; if(args.length>0) t+=`   Args: ${args.map(a=>a.text.slice(0,60)).join("; ")}\n`; t+=`   [Your reasoning…]\n`; });
  t+=`\n\nGENERAL ADVICE:\n  [Advice separated from decision reasons]\n`;
  S.oaNotes=t;
  const ta=document.getElementById("oa-textarea");
  if(ta) ta.value=t;
}

// ══════════════════════════════════════════════════════════════════════════════
// SAVE
// ══════════════════════════════════════════════════════════════════════════════
async function saveSession(){
  if(S.saving) return;
  // collect any live textarea values (for textareas that don't trigger re-render)
  const titleEl=document.getElementById("title-input"); if(titleEl) S.sessionTitle=titleEl.value;
  const motionEl=document.getElementById("motion-input"); if(motionEl) S.motion=motionEl.value;
  const roundEl=document.getElementById("round-input"); if(roundEl) S.round=roundEl.value;
  const oaEl=document.getElementById("oa-textarea"); if(oaEl) S.oaNotes=oaEl.value;

  S.saving=true;
  const btn=document.getElementById("save-btn");
  if(btn) btn.textContent="Saving…";

  const rankings=computeRankings(S.teams);
  const sessionData={
    id:S.editingId||uid(),
    title:S.sessionTitle||`${S.mode} Session`,
    mode:S.mode, motion:S.motion, round:S.round,
    teams:S.teams, oaNotes:S.oaNotes, clashes:S.clashes,
    rankings:rankings.map(r=>({id:r.id,total:r.total,autoRank:r.autoRank})),
    savedAt:new Date().toISOString(), created_at:new Date().toISOString(),
  };

  // Try Supabase
  if(S.editingId){
    await supaFetch(`debate_sessions?id=eq.${S.editingId}`,{method:"PATCH",body:JSON.stringify(sessionData)});
  } else {
    await supaFetch("debate_sessions",{method:"POST",body:JSON.stringify(sessionData)});
  }

  S.editingId=sessionData.id;
  const existing=S.savedNotes.filter(n=>n.id!==sessionData.id);
  S.savedNotes=[sessionData,...existing];
  persistSaved();

  S.saving=false;
  S.saveMsg="✓ Saved!";
  if(btn){ btn.textContent="✓ Saved!"; btn.className="btn btn-success"; }
  setTimeout(()=>{
    S.saveMsg="";
    const b=document.getElementById("save-btn");
    if(b){ b.textContent="💾 Save"; b.className="btn btn-primary"; }
  },2500);
}

// ══════════════════════════════════════════════════════════════════════════════
// BIND JUDGE VIEW
// ══════════════════════════════════════════════════════════════════════════════
function bindJudge(){
  // inputs that update state live
  const titleEl=document.getElementById("title-input");
  if(titleEl) titleEl.addEventListener("input",()=>S.sessionTitle=titleEl.value);
  const motionEl=document.getElementById("motion-input");
  if(motionEl) motionEl.addEventListener("input",()=>S.motion=motionEl.value);
  const roundEl=document.getElementById("round-input");
  if(roundEl) roundEl.addEventListener("input",()=>S.round=roundEl.value);
}

loadSaved();
render();
</script>
