<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adjudicator - Debate Assistant</title>
  
  <style>
    body { background-color: #0a0a0f; margin: 0; padding: 0; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── Supabase client (plug in your URL + anon key) ───────────────────────────
    // FIX 1: Cleaned base URL (removed trailing /rest/v1/ to prevent duplication)
    const SUPABASE_URL = "https://wflbkylzmedfvpbtosgg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Xx69UKocPcHChda3ea76JA_mguKTk4Z";

    async function supaFetch(path, opts = {}) {
      // Defensively strip any trailing '/rest/v1/' from the base URL if accidentally left in
      const baseUrl = SUPABASE_URL.replace(/\/rest\/v1\/?$/, "");

      const headers = {
        apikey: SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        Prefer: opts.prefer || "return=representation",
        ...opts.headers,
      };

      // FIX 2: Handle key formatting safely.
      // - Legacy tokens starting with 'eyJ' are JWTs and require a Bearer Authorization header.
      // - Modern keys starting with 'sb_publishable_' are opaque and will throw a 401 
      //   if passed under 'Bearer' without a signed-in user session. Omit it for public calls.
      if (SUPABASE_ANON_KEY.startsWith("eyJ") && !headers.Authorization) {
        headers.Authorization = `Bearer ${SUPABASE_ANON_KEY}`;
      }

      const res = await fetch(`${baseUrl}/rest/v1/${path}`, {
        ...opts,
        headers,
      });
      
      if (!res.ok) throw new Error(await res.text());
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    // ─── Constants ────────────────────────────────────────────────────────────────
    const BP_TEAMS = [
      { id: "OG", label: "Opening Government", abbr: "OG", bench: "gov", half: "opening" },
      { id: "OO", label: "Opening Opposition", abbr: "OO", bench: "opp", half: "opening" },
      { id: "CG", label: "Closing Government", abbr: "CG", bench: "gov", half: "closing" },
      { id: "CO", label: "Closing Opposition", abbr: "CO", bench: "opp", half: "closing" },
    ];

    const BP_ROLES = {
      OG: ["Prime Minister", "Deputy Prime Minister"],
      OO: ["Leader of Opposition", "Deputy Leader of Opposition"],
      CG: ["Member of Government", "Government Whip"],
      CO: ["Member of Opposition", "Opposition Whip"],
    };

    const AP_TEAMS = [
      { id: "GOV", label: "Government", abbr: "GOV", bench: "gov", half: "opening" },
      { id: "OPP", label: "Opposition", abbr: "OPP", bench: "opp", half: "opening" },
    ];

    const AP_ROLES = {
      GOV: ["Prime Minister", "Deputy Prime Minister", "Government Whip"],
      OPP: ["Leader of Opposition", "Deputy Leader of Opposition", "Opposition Whip"],
    };

    const SPEAKER_SCALE = [
      { range: "95–100", desc: "Plausibly one of the best speeches ever given" },
      { range: "92–94", desc: "Incredible speech, undoubtedly among best at competition" },
      { range: "89–91", desc: "Brilliant — demands extremely sophisticated responses" },
      { range: "86–88", desc: "Highly compelling, no logical gaps" },
      { range: "83–85", desc: "Addresses core issues with strong explanations" },
      { range: "79–82", desc: "Relevant, well-made, may be vulnerable to good responses" },
      { range: "76–78", desc: "Almost exclusively relevant, clear to follow" },
      { range: "73–75", desc: "Logical but simplistic, vulnerable to competent responses" },
      { range: "70–72", desc: "Frequently relevant, regular significant logical gaps" },
      { range: "67–69", desc: "Generally relevant, significant logical gaps throughout" },
      { range: "64–66", desc: "Some relevant arguments with significant logical gaps" },
      { range: "61–63", desc: "Some relevant claims, frequently unclear" },
      { range: "58–60", desc: "Occasionally relevant, hard to follow" },
      { range: "55–57", desc: "One or two marginally relevant claims" },
      { range: "50–54", desc: "Content not relevant, very hard to follow" },
    ];

    const ARGUMENT_TAGS = ["Economy", "Rights", "Democracy", "Environment", "Security", "Health", "Social", "Practical", "Principled", "Empirical"];
    const POI_QUALITY = { excellent: "✓✓", good: "✓", poor: "~", refused: "✗" };

    // ─── Utility helpers ──────────────────────────────────────────────────────────
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
    function fmtTime(s) {
      const m = Math.floor(s / 60), sec = s % 60;
      return `${m}:${sec.toString().padStart(2, "0")}`;
    }

    function defaultBPSession() {
      const teams = {};
      BP_TEAMS.forEach(t => {
        teams[t.id] = {
          id: t.id, label: t.label, abbr: t.abbr, bench: t.bench, half: t.half,
          speakers: BP_ROLES[t.id].map((role, i) => ({
            id: `${t.id}_s${i}`, role, name: "", score: 75, notes: "",
            pois_taken: [], pois_offered: [],
          })),
          teamNotes: "", arguments: [], rebuttals: [], contradictions: [],
          rank: null, extension: "",
        };
      });
      return teams;
    }

    function defaultAPSession() {
      const teams = {};
      AP_TEAMS.forEach(t => {
        teams[t.id] = {
          id: t.id, label: t.label, abbr: t.abbr, bench: t.bench, half: t.opening,
          speakers: AP_ROLES[t.id].map((role, i) => ({
            id: `${t.id}_s${i}`, role, name: "", score: 75, notes: "",
            pois_taken: [], pois_offered: [],
          })),
          teamNotes: "", arguments: [], rebuttals: [], contradictions: [],
          rank: null,
        };
      });
      return teams;
    }

    // Moved computation out to prevent dependency ordering errors
    function computeRankings(teams) {
      const entries = Object.values(teams).map(t => ({
        id: t.id,
        total: t.speakers.reduce((s, sp) => s + Number(sp.score || 0), 0),
        rank: t.rank,
      }));
      const sorted = [...entries].sort((a, b) => b.total - a.total);
      return sorted.map((e, i) => ({ ...e, autoRank: i + 1 }));
    }

    // ─── Timer component ──────────────────────────────────────────────────────────
    function FloatingTimer({ mode }) {
      const [phase, setPhase] = useState("prep");
      const [running, setRunning] = useState(false);
      const [elapsed, setElapsed] = useState(0);
      const [minimized, setMinimized] = useState(false);
      const intervalRef = useRef(null);

      const prepMax = mode === "BP" ? 15 * 60 : 30 * 60;
      const speakerMax = 7 * 60 + 15;
      const limit = phase === "prep" ? prepMax : speakerMax;
      const isOver = elapsed > limit;
      const isWarning = phase === "speaker" && elapsed >= 6 * 60 && elapsed < speakerMax;

      useEffect(() => {
        if (running) {
          intervalRef.current = setInterval(() => setElapsed(e => e + 1), 1000);
        } else {
          clearInterval(intervalRef.current);
        }
        return () => clearInterval(intervalRef.current);
      }, [running]);

      const reset = () => { setElapsed(0); setRunning(false); };
      const toggle = () => setRunning(r => !r);

      const pct = Math.min((elapsed / limit) * 100, 100);
      const timerColor = isOver ? "#ef4444" : isWarning ? "#f59e0b" : "#22c55e";
      const bgColor = isOver ? "rgba(239,68,68,0.1)" : "rgba(0,0,0,0.85)";

      if (minimized) {
        return (
          <div onClick={() => setMinimized(false)} style={{
            position: "fixed", bottom: 24, right: 24, zIndex: 9999,
            background: isOver ? "#ef4444" : "rgba(0,0,0,0.85)",
            borderRadius: 40, padding: "8px 16px", cursor: "pointer",
            display: "flex", alignItems: "center", gap: 8,
            animation: isOver ? "blink 0.8s step-end infinite" : "none",
            boxShadow: "0 4px 24px rgba(0,0,0,0.4)",
          }}>
            <span style={{ fontFamily: "monospace", fontSize: 18, fontWeight: 700, color: isOver ? "#fff" : timerColor }}>
              {fmtTime(elapsed)}
            </span>
            <span style={{ fontSize: 10, color: "rgba(255,255,255,0.5)" }}>tap to expand</span>
          </div>
        );
      }

      return (
        <div style={{
          position: "fixed", bottom: 24, right: 24, zIndex: 9999,
          background: bgColor, border: `1px solid ${isOver ? "#ef4444" : "rgba(255,255,255,0.1)"}`,
          borderRadius: 16, padding: "16px 20px", width: 240,
          boxShadow: "0 8px 32px rgba(0,0,0,0.5)",
          animation: isOver ? "blink 0.8s step-end infinite" : "none",
          backdropFilter: "blur(12px)",
          transition: "border-color 0.3s",
        }}>
          <style>{`@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }`}</style>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ display: "flex", gap: 4 }}>
              {["prep", "speaker"].map(p => (
                <button key={p} onClick={() => { setPhase(p); reset(); }} style={{
                  padding: "3px 10px", borderRadius: 20, fontSize: 11, fontWeight: 600,
                  background: phase === p ? timerColor : "transparent",
                  color: phase === p ? "#000" : "rgba(255,255,255,0.5)",
                  border: `1px solid ${phase === p ? timerColor : "rgba(255,255,255,0.15)"}`,
                  cursor: "pointer",
                }}>{p === "prep" ? "PREP" : "SPEAKER"}</button>
              ))}
            </div>
            <button onClick={() => setMinimized(true)} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.4)", cursor: "pointer", fontSize: 16, padding: 0 }}>–</button>
          </div>

          <div style={{ textAlign: "center", marginBottom: 12 }}>
            <div style={{
              fontFamily: "monospace", fontSize: 36, fontWeight: 700,
              color: isOver ? "#ef4444" : isWarning ? "#f59e0b" : "#fff",
              letterSpacing: 2,
              animation: isOver ? "blink 0.8s step-end infinite" : "none",
            }}>{fmtTime(elapsed)}</div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", marginTop: 2 }}>
              {phase === "prep" ? `${mode} prep — ${mode === "BP" ? "15:00" : "30:00"} limit` : "7:15 limit — POI from 1:00–6:00"}
            </div>
          </div>

          <div style={{ background: "rgba(255,255,255,0.1)", borderRadius: 4, height: 4, marginBottom: 12, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${pct}%`, background: timerColor, borderRadius: 4, transition: "width 0.5s, background 0.3s" }} />
          </div>

          {phase === "speaker" && (
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10, fontSize: 10, color: "rgba(255,255,255,0.35)" }}>
              <span>1:00 POI open</span><span>6:00 POI close</span><span>7:15 hard stop</span>
            </div>
          )}

          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={toggle} style={{
              flex: 1, padding: "8px 0", borderRadius: 8, fontWeight: 700, fontSize: 13,
              background: running ? "#ef4444" : timerColor,
              color: "#000", border: "none", cursor: "pointer",
              transition: "background 0.2s",
            }}>{running ? "⏸ PAUSE" : "▶ START"}</button>
            <button onClick={reset} style={{
              padding: "8px 12px", borderRadius: 8, fontWeight: 700, fontSize: 13,
              background: "rgba(255,255,255,0.1)", color: "#fff", border: "none", cursor: "pointer",
            }}>↺</button>
          </div>
        </div>
      );
    }

    // ─── Argument card ─────────────────────────────────────────────────────────────
    function ArgumentCard({ arg, onUpdate, onDelete }) {
      return (
        <div style={{
          background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)",
          borderRadius: 10, padding: 12, marginBottom: 8,
        }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
            <select value={arg.strength} onChange={e => onUpdate({ ...arg, strength: e.target.value })}
              style={{ fontSize: 11, padding: "2px 6px", borderRadius: 6, background: "rgba(255,255,255,0.08)", color: "#fff", border: "1px solid rgba(255,255,255,0.15)" }}>
              <option value="strong">💪 Strong</option>
              <option value="medium">⚡ Medium</option>
              <option value="weak">⚠ Weak</option>
            </select>
            <select value={arg.tag} onChange={e => onUpdate({ ...arg, tag: e.target.value })}
              style={{ fontSize: 11, padding: "2px 6px", borderRadius: 6, background: "rgba(255,255,255,0.08)", color: "#fff", border: "1px solid rgba(255,255,255,0.15)" }}>
              {ARGUMENT_TAGS.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <select value={arg.status} onChange={e => onUpdate({ ...arg, status: e.target.value })}
              style={{ fontSize: 11, padding: "2px 6px", borderRadius: 6, background: arg.status === "rebutted" ? "rgba(239,68,68,0.15)" : arg.status === "conceded" ? "rgba(34,197,94,0.15)" : "rgba(255,255,255,0.08)", color: "#fff", border: "1px solid rgba(255,255,255,0.15)" }}>
              <option value="standing">Standing</option>
              <option value="rebutted">Rebutted</option>
              <option value="conceded">Conceded ✓</option>
              <option value="dropped">Dropped</option>
            </select>
            <button onClick={onDelete} style={{ marginLeft: "auto", background: "none", border: "none", color: "rgba(255,100,100,0.6)", cursor: "pointer", fontSize: 14, padding: 0 }}>✕</button>
          </div>
          <textarea value={arg.text} onChange={e => onUpdate({ ...arg, text: e.target.value })}
            placeholder="Argument summary…"
            style={{
              width: "100%", background: "transparent", border: "none", color: "#fff",
              fontSize: 13, resize: "none", outline: "none", lineHeight: 1.5, minHeight: 40,
              fontFamily: "inherit",
            }} />
        </div>
      );
    }

    // ─── Speaker card ─────────────────────────────────────────────────────────────
    function SpeakerCard({ speaker, onUpdate, teamColor }) {
      const [showScale, setShowScale] = useState(false);
      const score = Number(speaker.score || 75);
      const scoreColor = score >= 83 ? "#22c55e" : score >= 73 ? "#f59e0b" : score >= 64 ? "#f97316" : "#ef4444";

      return (
        <div style={{
          background: "rgba(255,255,255,0.03)", border: `1px solid ${teamColor}30`,
          borderLeft: `3px solid ${teamColor}`, borderRadius: 10, padding: 14, marginBottom: 10,
        }}>
          <div style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 10 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", marginBottom: 3, fontWeight: 600, letterSpacing: 0.5 }}>{speaker.role.toUpperCase()}</div>
              <input value={speaker.name} onChange={e => onUpdate({ ...speaker, name: e.target.value })}
                placeholder="Speaker name…"
                style={{ background: "transparent", border: "none", color: "#fff", fontSize: 14, fontWeight: 600, outline: "none", width: "100%", fontFamily: "inherit" }} />
            </div>
            <div style={{ textAlign: "center", minWidth: 64 }}>
              <div style={{ fontSize: 24, fontWeight: 800, color: scoreColor, lineHeight: 1 }}>{score}</div>
              <div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)", marginTop: 2 }}>/ 100</div>
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
            <span style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", minWidth: 32 }}>Score</span>
            <input type="range" min={50} max={100} value={score}
              onChange={e => onUpdate({ ...speaker, score: Number(e.target.value) })}
              style={{ flex: 1, accentColor: scoreColor }} />
            <input type="number" min={50} max={100} value={score}
              onChange={e => onUpdate({ ...speaker, score: Number(e.target.value) })}
              style={{ width: 48, background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 6, color: "#fff", fontSize: 12, textAlign: "center", padding: "2px 4px", fontFamily: "inherit" }} />
            <button onClick={() => setShowScale(s => !s)} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.3)", cursor: "pointer", fontSize: 12 }}>?</button>
          </div>

          {showScale && (
            <div style={{ background: "rgba(0,0,0,0.4)", borderRadius: 8, padding: 10, marginBottom: 8, maxHeight: 160, overflowY: "auto", fontSize: 11 }}>
              {SPEAKER_SCALE.map(s => (
                <div key={s.range} style={{ display: "flex", gap: 8, marginBottom: 4, color: "rgba(255,255,255,0.7)" }}>
                  <span style={{ minWidth: 48, color: "#f59e0b", fontWeight: 700 }}>{s.range}</span>
                  <span>{s.desc}</span>
                </div>
              ))}
            </div>
          )}

          <div style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 4 }}>Speaker notes</div>
            <textarea value={speaker.notes} onChange={e => onUpdate({ ...speaker, notes: e.target.value })}
              placeholder="Notes on this speaker's performance, POIs, style…"
              style={{
                width: "100%", background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)",
                borderRadius: 8, color: "#fff", fontSize: 12, padding: "8px 10px", resize: "vertical",
                minHeight: 60, outline: "none", lineHeight: 1.5, fontFamily: "inherit", boxSizing: "border-box",
              }} />
          </div>

          <div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 4 }}>POI tracking</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {["taken_excellent", "taken_good", "taken_poor", "refused", "offered"].map(type => {
                const count = (speaker.pois_taken || []).filter(p => p === type).length
                  + (type === "offered" ? (speaker.pois_offered || []).length : 0);
                const label = { taken_excellent: "✓✓ Excellent", taken_good: "✓ Good", taken_poor: "~ Poor", refused: "✗ Refused", offered: "→ Offered" }[type];
                const col = { taken_excellent: "#22c55e", taken_good: "#86efac", taken_poor: "#f59e0b", refused: "#ef4444", offered: "#60a5fa" }[type];
                return (
                  <button key={type}
                    onClick={() => {
                      if (type === "offered") {
                        onUpdate({ ...speaker, pois_offered: [...(speaker.pois_offered || []), "offered"] });
                      } else {
                        onUpdate({ ...speaker, pois_taken: [...(speaker.pois_taken || []), type] });
                      }
                    }}
                    style={{
                      fontSize: 10, padding: "3px 8px", borderRadius: 20, cursor: "pointer",
                      background: `${col}20`, color: col, border: `1px solid ${col}40`, fontWeight: 600,
                    }}>
                    {label} {count > 0 ? `(${count})` : "+"}
                  </button>
                );
              })}
              {((speaker.pois_taken || []).length + (speaker.pois_offered || []).length) > 0 && (
                <button onClick={() => onUpdate({ ...speaker, pois_taken: [], pois_offered: [] })}
                  style={{ fontSize: 10, padding: "3px 8px", borderRadius: 20, cursor: "pointer", background: "rgba(239,68,68,0.1)", color: "#f87171", border: "1px solid rgba(239,68,68,0.2)" }}>
                  clear
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Team panel ────────────────────────────────────────────────────────────────
    function TeamPanel({ team, onUpdate, rankInfo, rankings }) {
      const TEAM_COLORS = { OG: "#818cf8", OO: "#fb923c", CG: "#4ade80", CO: "#f472b6", GOV: "#818cf8", OPP: "#fb923c" };
      const color = TEAM_COLORS[team.id] || "#818cf8";
      const total = team.speakers.reduce((s, sp) => s + Number(sp.score || 0), 0);

      const updateSpeaker = (idx, updated) => {
        const speakers = [...team.speakers];
        speakers[idx] = updated;
        onUpdate({ ...team, speakers });
      };

      const addArgument = () => {
        onUpdate({ ...team, arguments: [...(team.arguments || []), { id: uid(), text: "", strength: "medium", tag: "Practical", status: "standing" }] });
      };

      const updateArgument = (id, updated) => {
        onUpdate({ ...team, arguments: team.arguments.map(a => a.id === id ? updated : a) });
      };

      const deleteArgument = (id) => {
        onUpdate({ ...team, arguments: team.arguments.filter(a => a.id !== id) });
      };

      const rankLabel = rankInfo ? `#${rankInfo.autoRank}` : "–";
      const rankColors = ["", "#ffd700", "#c0c0c0", "#cd7f32", "#888"];

      return (
        <div style={{
          background: "rgba(255,255,255,0.03)", border: `1px solid ${color}25`,
          borderTop: `3px solid ${color}`, borderRadius: 14, overflow: "hidden",
        }}>
          <div style={{ padding: "14px 16px", borderBottom: "1px solid rgba(255,255,255,0.06)", display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{
              background: `${color}20`, color, fontWeight: 800, fontSize: 14,
              padding: "4px 12px", borderRadius: 20, border: `1px solid ${color}40`,
              letterSpacing: 1,
            }}>{team.abbr}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#fff" }}>{team.label}</div>
              <div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)" }}>
                {team.bench === "gov" ? "Government" : "Opposition"} · {team.half === "opening" ? "Opening" : "Closing"}
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 20, fontWeight: 800, color }}>Σ {total}</div>
              <div style={{ fontSize: 10, color: rankColors[rankInfo?.autoRank] || "#888", fontWeight: 700 }}>
                {rankInfo ? `Rank ${rankLabel}` : "–"}
              </div>
            </div>
          </div>

          <div style={{ padding: 16 }}>
            <div style={{ marginBottom: 14 }}>
              {team.speakers.map((sp, i) => (
                <SpeakerCard key={sp.id} speaker={sp} teamColor={color} onUpdate={updated => updateSpeaker(i, updated)} />
              ))}
            </div>

            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 6, fontWeight: 600, letterSpacing: 0.5 }}>TEAM NOTES</div>
              <textarea value={team.teamNotes || ""} onChange={e => onUpdate({ ...team, teamNotes: e.target.value })}
                placeholder="Overall team notes, case strategy, bench dynamics…"
                style={{
                  width: "100%", background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)",
                  borderRadius: 8, color: "#fff", fontSize: 12, padding: "10px 12px", resize: "vertical",
                  minHeight: 70, outline: "none", lineHeight: 1.5, fontFamily: "inherit", boxSizing: "border-box",
                }} />
            </div>

            {team.id === "CG" || team.id === "CO" ? (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 6, fontWeight: 600, letterSpacing: 0.5 }}>EXTENSION / NEW GROUND</div>
                <textarea value={team.extension || ""} onChange={e => onUpdate({ ...team, extension: e.target.value })}
                  placeholder="What's new? Extension material, new characterizations, unique angles…"
                  style={{
                    width: "100%", background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,179,0,0.15)",
                    borderRadius: 8, color: "#fff", fontSize: 12, padding: "10px 12px", resize: "vertical",
                    minHeight: 60, outline: "none", lineHeight: 1.5, fontFamily: "inherit", boxSizing: "border-box",
                  }} />
              </div>
            ) : null}

            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", fontWeight: 600, letterSpacing: 0.5 }}>ARGUMENTS TRACKER</div>
                <button onClick={addArgument} style={{
                  fontSize: 11, padding: "3px 10px", borderRadius: 20,
                  background: `${color}20`, color, border: `1px solid ${color}40`, cursor: "pointer", fontWeight: 600,
                }}>+ Add</button>
              </div>
              {(team.arguments || []).map(arg => (
                <ArgumentCard key={arg.id} arg={arg}
                  onUpdate={updated => updateArgument(arg.id, updated)}
                  onDelete={() => deleteArgument(arg.id)} />
              ))}
              {(team.arguments || []).length === 0 && (
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.2)", textAlign: "center", padding: "12px 0" }}>
                  No arguments tracked yet — click + Add
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Clash matrix ──────────────────────────────────────────────────────────────
    function ClashMatrix({ teams, onUpdate }) {
      const teamIds = Object.keys(teams);
      const [clashes, setClashes] = useState({});

      const getClashKey = (a, b) => [a, b].sort().join("_vs_");
      const setClash = (a, b, val) => {
        const key = getClashKey(a, b);
        const updated = { ...clashes, [key]: val };
        setClashes(updated);
        onUpdate(updated);
      };

      const pairs = [];
      for (let i = 0; i < teamIds.length; i++) {
        for (let j = i + 1; j < teamIds.length; j++) {
          pairs.push([teamIds[i], teamIds[j]]);
        }
      }

      return (
        <div>
          <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 10, fontWeight: 600, letterSpacing: 0.5 }}>PAIRWISE CLASH NOTES</div>
          {pairs.map(([a, b]) => {
            const key = getClashKey(a, b);
            return (
              <div key={key} style={{ marginBottom: 8 }}>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", marginBottom: 4 }}>
                  <span style={{ fontWeight: 700, color: "#818cf8" }}>{a}</span>
                  <span style={{ color: "rgba(255,255,255,0.25)" }}> vs </span>
                  <span style={{ fontWeight: 700, color: "#fb923c" }}>{b}</span>
                </div>
                <textarea value={clashes[key] || ""} onChange={e => setClash(a, b, e.target.value)}
                  placeholder={`Who won the ${a} vs ${b} clash? Why?`}
                  style={{
                    width: "100%", background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)",
                    borderRadius: 8, color: "#fff", fontSize: 12, padding: "8px 10px", resize: "vertical",
                    minHeight: 52, outline: "none", lineHeight: 1.5, fontFamily: "inherit", boxSizing: "border-box",
                  }} />
              </div>
            );
          })}
        </div>
      );
    }

    // ─── OA Prep panel ────────────────────────────────────────────────────────────
    function OAPanel({ teams, rankings, mode, oaNotes, onUpdateOA }) {
      const TEAM_COLORS = { OG: "#818cf8", OO: "#fb923c", CG: "#4ade80", CO: "#f472b6", GOV: "#818cf8", OPP: "#fb923c" };
      const sorted = [...rankings].sort((a, b) => a.autoRank - b.autoRank);
      const rankEmoji = ["🥇", "🥈", "🥉", "4️⃣"];

      const generateOATemplate = () => {
        let template = `=== OA STRUCTURE ===\n\n`;
        template += `RANKING ANNOUNCEMENT:\n`;
        sorted.forEach((r, i) => {
          const t = teams[r.id];
          template += `  ${rankEmoji[i]} ${i + 1}st: ${r.id} (${t?.label}) — Total: ${r.total}\n`;
        });
        template += `\n`;

        if (mode === "BP") {
          template += `PAIRWISE COMPARISONS TO COVER:\n`;
          template += `  [ ] OG vs OO — top half\n`;
          template += `  [ ] CG vs CO — bottom half\n`;
          template += `  [ ] OG vs CG — gov bench\n`;
          template += `  [ ] OO vs CO — opp bench\n`;
          template += `  [ ] OG vs CO — diagonal\n`;
          template += `  [ ] OO vs CG — diagonal\n\n`;
        } else {
          template += `PAIRWISE COMPARISON:\n  [ ] GOV vs OPP\n\n`;
        }

        template += `RANKING JUSTIFICATION:\n`;
        sorted.forEach((r, i) => {
          const t = teams[r.id];
          template += `\n${i + 1}. ${r.id} — ${t?.label}\n`;
          const args = t?.arguments || [];
          if (args.length > 0) {
            template += `   Key arguments: ${args.map(a => a.text.slice(0, 50)).join("; ")}\n`;
          }
          template += `   [Your notes here…]\n`;
        });

        template += `\n\nGENERAL ADVICE:\n  [Advice separated from decision reasons]\n`;
        onUpdateOA(template);
      };

      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>OA Preparation & Ranking Summary</div>
            <button onClick={generateOATemplate} style={{
              fontSize: 11, padding: "5px 14px", borderRadius: 20,
              background: "rgba(129,140,248,0.15)", color: "#818cf8",
              border: "1px solid rgba(129,140,248,0.3)", cursor: "pointer", fontWeight: 600,
            }}>✨ Auto-generate template</button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 8, marginBottom: 20 }}>
            {sorted.map((r, i) => (
              <div key={r.id} style={{
                background: `${TEAM_COLORS[r.id]}10`, border: `1px solid ${TEAM_COLORS[r.id]}30`,
                borderRadius: 10, padding: "10px 12px", textAlign: "center",
              }}>
                <div style={{ fontSize: 20 }}>{rankEmoji[i]}</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: TEAM_COLORS[r.id], marginTop: 4 }}>{r.id}</div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)" }}>{teams[r.id]?.label}</div>
                <div style={{ fontSize: 22, fontWeight: 800, color: "#fff", marginTop: 6 }}>{r.total}</div>
                <div style={{ fontSize: 10, color: "rgba(255,255,255,0.3)" }}>combined pts</div>
              </div>
            ))}
          </div>

          <div style={{ marginBottom: 10, fontSize: 11, color: "rgba(255,255,255,0.35)", fontWeight: 600, letterSpacing: 0.5 }}>OA NOTES & SCRIPT</div>
          <textarea value={oaNotes} onChange={e => onUpdateOA(e.target.value)}
            placeholder="Write your OA here — structure, key comparisons, advice for teams…"
            style={{
              width: "100%", background: "rgba(255,255,255,0.04)", border: "1px solid rgba(129,140,248,0.2)",
              borderRadius: 10, color: "#fff", fontSize: 13, padding: "14px 16px", resize: "vertical",
              minHeight: 320, outline: "none", lineHeight: 1.7, fontFamily: "'Fira Code', 'Courier New', monospace",
              boxSizing: "border-box",
            }} />

          <div style={{ marginTop: 16, background: "rgba(251,191,36,0.05)", border: "1px solid rgba(251,191,36,0.15)", borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 11, color: "#fbbf24", fontWeight: 700, marginBottom: 8 }}>📋 OA CHECKLIST</div>
            {[
              "Announce ranking clearly at the start",
              "Cover ALL pairwise comparisons (min 6 for BP)",
              "Identify specific arguments — avoid vague adjectives",
              "Explain why stronger arguments beat weaker ones",
              "Separate advice from decision reasons",
              "Note any split decisions and which comparisons were voted on",
              "Invite teams for post-round feedback",
              "Stay within 10–15 minutes",
            ].map((item, i) => (
              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 4, fontSize: 12, color: "rgba(255,255,255,0.6)" }}>
                <span style={{ color: "#fbbf24" }}>□</span>{item}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─── Saved notes list ──────────────────────────────────────────────────────────
    function SavedNotesList({ notes, onLoad, onDelete, onNew }) {
      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
            <div>
              <div style={{ fontSize: 22, fontWeight: 800, color: "#fff", letterSpacing: -0.5 }}>Saved Sessions</div>
              <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginTop: 2 }}>{notes.length} session{notes.length !== 1 ? "s" : ""} saved</div>
            </div>
            <button onClick={onNew} style={{
              padding: "10px 20px", borderRadius: 10, fontWeight: 700, fontSize: 13,
              background: "linear-gradient(135deg, #818cf8, #6366f1)", color: "#fff",
              border: "none", cursor: "pointer",
            }}>+ New Session</button>
          </div>

          {notes.length === 0 && (
            <div style={{ textAlign: "center", padding: "60px 0", color: "rgba(255,255,255,0.25)" }}>
              <div style={{ fontSize: 48, marginBottom: 12 }}>📋</div>
              <div style={{ fontSize: 14 }}>No saved sessions yet</div>
              <div style={{ fontSize: 12, marginTop: 4 }}>Complete a judging session and save it</div>
            </div>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {notes.map(note => {
              const date = new Date(note.created_at || note.savedAt);
              const rankings = note.rankings || [];
              return (
                <div key={note.id} style={{
                  background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)",
                  borderRadius: 12, padding: 16, display: "flex", gap: 14, alignItems: "flex-start",
                }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: "#fff", marginBottom: 4 }}>{note.title}</div>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", marginBottom: 6 }}>
                      {note.mode} · {date.toLocaleDateString()} {date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                    </div>
                    {note.motion && (
                      <div style={{ fontSize: 12, color: "rgba(255,255,255,0.5)", marginBottom: 6, fontStyle: "italic" }}>
                        "{note.motion}"
                      </div>
                    )}
                    {rankings.length > 0 && (
                      <div style={{ display: "flex", gap: 6 }}>
                        {rankings.slice(0, 4).map((r, i) => (
                          <span key={i} style={{ fontSize: 10, padding: "2px 8px", borderRadius: 20, background: "rgba(129,140,248,0.15)", color: "#818cf8", fontWeight: 600 }}>
                            #{i + 1} {r.id}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    <button onClick={() => onLoad(note)} style={{
                      padding: "6px 14px", borderRadius: 8, fontSize: 12, fontWeight: 600,
                      background: "rgba(129,140,248,0.15)", color: "#818cf8",
                      border: "1px solid rgba(129,140,248,0.3)", cursor: "pointer",
                    }}>Open</button>
                    <button onClick={() => {
                      const blob = new Blob([JSON.stringify(note, null, 2)], { type: "application/json" });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement("a");
                      a.href = url; a.download = `${note.title}.json`; a.click();
                      URL.revokeObjectURL(url);
                    }} style={{
                      padding: "6px 14px", borderRadius: 8, fontSize: 12, fontWeight: 600,
                      background: "rgba(34,197,94,0.1)", color: "#4ade80",
                      border: "1px solid rgba(34,197,94,0.2)", cursor: "pointer",
                    }}>↓ Export</button>
                    <button onClick={() => onDelete(note.id)} style={{
                      padding: "6px 14px", borderRadius: 8, fontSize: 12, fontWeight: 600,
                      background: "rgba(239,68,68,0.1)", color: "#f87171",
                      border: "1px solid rgba(239,68,68,0.2)", cursor: "pointer",
                    }}>Delete</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── Main app ─────────────────────────────────────────────────────────────────
    function App() {
      const [view, setView] = useState("home");
      const [mode, setMode] = useState("BP");
      const [sessionTitle, setSessionTitle] = useState("");
      const [motion, setMotion] = useState("");
      const [round, setRound] = useState("");
      const [teams, setTeams] = useState(defaultBPSession());
      const [oaNotes, setOANotes] = useState("");
      const [clashes, setClashes] = useState({});
      const [savedNotes, setSavedNotes] = useState([]);
      const [activeTab, setActiveTab] = useState("OG");
      const [judgeTab, setJudgeTab] = useState("teams");
      const [saving, setSaving] = useState(false);
      const [saveMsg, setSaveMsg] = useState("");
      const [editingId, setEditingId] = useState(null);

      useEffect(() => {
        const stored = localStorage.getItem("debate_judge_sessions");
        if (stored) setSavedNotes(JSON.parse(stored));
      }, []);

      const persistNotes = (notes) => {
        setSavedNotes(notes);
        localStorage.setItem("debate_judge_sessions", JSON.stringify(notes));
      };

      const startNewSession = (selectedMode) => {
        setMode(selectedMode);
        setTeams(selectedMode === "BP" ? defaultBPSession() : defaultAPSession());
        setOANotes("");
        setClashes({});
        setSessionTitle(`${selectedMode} Session — ${new Date().toLocaleDateString()}`);
        setMotion("");
        setRound("");
        setEditingId(null);
        setActiveTab(selectedMode === "BP" ? "OG" : "GOV");
        setJudgeTab("teams");
        setView("judge");
      };

      const updateTeam = (id, updated) => {
        setTeams(prev => ({ ...prev, [id]: updated }));
      };

      const rankings = computeRankings(teams);

      const saveSession = async () => {
        setSaving(true);
        const sessionData = {
          id: editingId || uid(),
          title: sessionTitle || `${mode} Session`,
          mode, motion, round, teams, oaNotes, clashes,
          rankings: rankings.map(r => ({ id: r.id, total: r.total, autoRank: r.autoRank })),
          savedAt: new Date().toISOString(),
          created_at: new Date().toISOString(),
        };

        try {
          if (SUPABASE_URL !== "YOUR_SUPABASE_URL") {
            if (editingId) {
              await supaFetch(`debate_sessions?id=eq.${editingId}`, {
                method: "PATCH", body: JSON.stringify(sessionData),
              });
            } else {
              await supaFetch("debate_sessions", { method: "POST", body: JSON.stringify(sessionData) });
            }
          }
        } catch (e) { console.warn("Supabase save failed, using localStorage:", e); }

        const existing = savedNotes.filter(n => n.id !== sessionData.id);
        persistNotes([sessionData, ...existing]);
        setEditingId(sessionData.id);
        setSaveMsg("✓ Saved!");
        setSaving(false);
        setTimeout(() => setSaveMsg(""), 2500);
      };

      const loadSession = (note) => {
        setMode(note.mode);
        setTeams(note.teams);
        setOANotes(note.oaNotes || "");
        setClashes(note.clashes || {});
        setSessionTitle(note.title);
        setMotion(note.motion || "");
        setRound(note.round || "");
        setEditingId(note.id);
        setActiveTab(note.mode === "BP" ? "OG" : "GOV");
        setJudgeTab("teams");
        setView("judge");
      };

      const deleteSession = (id) => {
        if (!confirm("Delete this session?")) return;
        persistNotes(savedNotes.filter(n => n.id !== id));
      };

      const teamIds = mode === "BP" ? BP_TEAMS.map(t => t.id) : AP_TEAMS.map(t => t.id);
      const TEAM_COLORS = { OG: "#818cf8", OO: "#fb923c", CG: "#4ade80", CO: "#f472b6", GOV: "#818cf8", OPP: "#fb923c" };

      if (view === "home") {
        return (
          <div style={{
            minHeight: "100vh", background: "#0a0a0f",
            fontFamily: "'DM Sans', 'Segoe UI', sans-serif",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",

              @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');
              * { box-sizing: border-box; margin: 0; padding: 0; }
              ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
              button { font-family: inherit; } input, textarea, select { font-family: inherit; }
              @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
              @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
            `}</style>

            <div style={{ animation: "fadeIn 0.6s ease", textAlign: "center", maxWidth: 560 }}>

              <h1 style={{ fontSize: 40, fontWeight: 800, color: "#fff", letterSpacing: -1.5, marginBottom: 8 }}>
                Adjudicator
              </h1>
              <p style={{ fontSize: 16, color: "rgba(255,255,255,0.4)", marginBottom: 40, lineHeight: 1.6 }}>
                Professional note-taking & judging assistant for BP and AP debate competitions

                {[
                  { mode: "BP", title: "British Parliamentary", desc: "4 teams · 8 speeches · WUDC format", icon: "🏛️", detail: "OG · OO · CG · CO" },

                  </button>
                ))}
              </div>

              <button onClick={() => setView("saved")} style={{
                width: "100%", padding: "14px", borderRadius: 12, cursor: "pointer",
                background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.08)",
                color: "rgba(255,255,255,0.6)", fontSize: 14, fontWeight: 500,
              }}>
                📁 Saved Sessions ({savedNotes.length})
              </button>

              <div style={{ marginTop: 32, display: "flex", gap: 20, justifyContent: "center", fontSize: 12, color: "rgba(255,255,255,0.2)" }}>
                <span>⏱ Smart timer</span>
                <span>📊 Score tracking</span>
                <span>🗒️ OA prep</span>
                <span>💾 Auto-save</span>
              </div>
            </div>
          </div>
        );
      }

      if (view === "saved") {
        return (
          <div style={{
            minHeight: "100vh", background: "#0a0a0f", fontFamily: "'DM Sans', 'Segoe UI', sans-serif",
            padding: "24px", color: "#fff",
          }}>
            <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap'); * { box-sizing:border-box; }`}</style>
            <div style={{ maxWidth: 800, margin: "0 auto" }}>
              <button onClick={() => setView("home")} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.4)", cursor: "pointer", fontSize: 14, marginBottom: 20, padding: 0 }}>
                ← Back to home
              </button>
              <SavedNotesList notes={savedNotes} onLoad={loadSession} onDelete={deleteSession} onNew={() => setView("home")} />
            </div>
          </div>
        );

          minHeight: "100vh", background: "#0a0a0f", fontFamily: "'DM Sans', 'Segoe UI', sans-serif", color: "#fff",

            * { box-sizing: border-box; }

            background: "rgba(10,10,15,0.95)", backdropFilter: "blur(16px)",
            borderBottom: "1px solid rgba(255,255,255,0.06)",
            padding: "0 16px",
          }}>
            <div style={{ maxWidth: 1400, margin: "0 auto", display: "flex", alignItems: "center", gap: 12, height: 56 }}>
              <button onClick={() => setView("home")} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.35)", cursor: "pointer", fontSize: 18, padding: 0, flexShrink: 0 }}>←</button>

              <div style={{
                background: "rgba(129,140,248,0.2)", color: "#818cf8", fontWeight: 800, fontSize: 11,

                  background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.08)",
                  borderRadius: 8, color: "#fff", fontSize: 12, padding: "4px 10px", width: 80, outline: "none",
                }} />

              <button onClick={() => setView("saved")} style={{
                fontSize: 12, padding: "5px 12px", borderRadius: 8, flexShrink: 0,
                background: "rgba(255,255,255,0.05)", color: "rgba(255,255,255,0.5)",
                border: "1px solid rgba(255,255,255,0.08)", cursor: "pointer",
              }}>📁 Saved</button>

              <button onClick={saveSession} disabled={saving} style={{
                fontSize: 12, padding: "5px 16px", borderRadius: 8, flexShrink: 0,
                background: saveMsg ? "rgba(34,197,94,0.2)" : "rgba(129,140,248,0.2)",
                color: saveMsg ? "#4ade80" : "#818cf8",
                border: `1px solid ${saveMsg ? "rgba(34,197,94,0.3)" : "rgba(129,140,248,0.3)"}`,
                cursor: saving ? "not-allowed" : "pointer", fontWeight: 600, transition: "all 0.3s",
              }}>{saving ? "Saving…" : saveMsg || "💾 Save"}</button>
            </div>

            {/* Motion bar */}
            <div style={{ maxWidth: 1400, margin: "0 auto", paddingBottom: 8 }}>
              <input value={motion} onChange={e => setMotion(e.target.value)}
                placeholder="Motion: This House would / believes / supports…"
                style={{
                  width: "100%", background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.06)",
                  borderRadius: 8, color: "rgba(255,255,255,0.8)", fontSize: 13, padding: "6px 12px", outline: "none",
                  fontStyle: "italic",
                }} />
            </div>

            {/* Tab bar */}
            <div style={{ maxWidth: 1400, margin: "0 auto", display: "flex", gap: 0, borderTop: "1px solid rgba(255,255,255,0.05)" }}>
              {[
                { id: "teams", label: "📝 Team Notes" },
                { id: "clash", label: "⚔️ Clash Analysis" },
                { id: "oa", label: "🎤 OA Prep" },
              ].map(tab => (
                <button key={tab.id} onClick={() => setJudgeTab(tab.id)} style={{
                  padding: "10px 16px", background: "none", border: "none",
                  color: judgeTab === tab.id ? "#818cf8" : "rgba(255,255,255,0.35)",
                  borderBottom: `2px solid ${judgeTab === tab.id ? "#818cf8" : "transparent"}`,
                  cursor: "pointer", fontSize: 12, fontWeight: 600, transition: "all 0.15s",
                }}>{tab.label}</button>
              ))}
            </div>
          </div>

          {/* Content */}
          <div style={{ maxWidth: 1400, margin: "0 auto", padding: "20px 16px 120px" }}>

            {judgeTab === "teams" && (
              <div>
                {/* Team selector tabs */}
                <div style={{ display: "flex", gap: 8, marginBottom: 20, overflowX: "auto", paddingBottom: 4 }}>
                  {teamIds.map(tid => {
                    const rankInfo = rankings.find(r => r.id === tid);
                    const color = TEAM_COLORS[tid];
                    return (
                      <button key={tid} onClick={() => setActiveTab(tid)} style={{
                        padding: "8px 18px", borderRadius: 10, cursor: "pointer", flexShrink: 0,
                        background: activeTab === tid ? `${color}20` : "rgba(255,255,255,0.04)",
                        border: `1px solid ${activeTab === tid ? color + "50" : "rgba(255,255,255,0.08)"}`,
                        color: activeTab === tid ? color : "rgba(255,255,255,0.5)",
                        fontWeight: activeTab === tid ? 700 : 500, fontSize: 13, transition: "all 0.15s",
                      }}>
                        {tid}
                        {rankInfo && (
                          <span style={{ marginLeft: 8, fontSize: 10, color: activeTab === tid ? color : "rgba(255,255,255,0.3)" }}>
                            #{rankInfo.autoRank} · {rankInfo.total}
                          </span>
                        )}
                      </button>
                    );
                  })}

                  <div style={{ marginLeft: "auto", display: "flex", gap: 6, alignItems: "center" }}>
                    {/* Rankings mini summary */}
                    {rankings.map((r, i) => (
                      <div key={r.id} style={{
                        fontSize: 10, padding: "3px 8px", borderRadius: 20,
                        background: `${TEAM_COLORS[r.id]}15`, color: TEAM_COLORS[r.id],
                        border: `1px solid ${TEAM_COLORS[r.id]}30`, fontWeight: 700,
                      }}>#{i + 1} {r.id}</div>
                    ))}
                  </div>
                </div>

                {/* Active team panel */}
                {teams[activeTab] && (
                  <TeamPanel
                    team={teams[activeTab]}
                    onUpdate={updated => updateTeam(activeTab, updated)}
                    rankInfo={rankings.find(r => r.id === activeTab)}
                    rankings={rankings}
                  />
                )}

                {/* Quick overview row */}
                <div style={{ marginTop: 20, background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.05)", borderRadius: 14, padding: 16 }}>
                  <div style={{ fontSize: 11, color: "rgba(255,255,255,0.3)", marginBottom: 12, fontWeight: 600, letterSpacing: 0.5 }}>SCORE OVERVIEW</div>
                  <div style={{ display: "grid", gridTemplateColumns: `repeat(${teamIds.length}, 1fr)`, gap: 12 }}>
                    {teamIds.map(tid => {
                      const t = teams[tid];
                      const color = TEAM_COLORS[tid];
                      const total = t.speakers.reduce((s, sp) => s + Number(sp.score || 0), 0);
                      const rankInfo = rankings.find(r => r.id === tid);
                      return (
                        <div key={tid} style={{ textAlign: "center" }}>
                          <div style={{ fontSize: 11, color, fontWeight: 700, marginBottom: 4 }}>{tid}</div>
                          {t.speakers.map(sp => (
                            <div key={sp.id} style={{ fontSize: 11, color: "rgba(255,255,255,0.5)", marginBottom: 1 }}>
                              {sp.role.split(" ").pop()}: <span style={{ color: "#fff", fontWeight: 600 }}>{sp.score}</span>
                            </div>
                          ))}
                          <div style={{ marginTop: 6, fontSize: 16, fontWeight: 800, color }}>Σ {total}</div>
                          <div style={{ fontSize: 10, color: "rgba(255,255,255,0.3)" }}>Rank #{rankInfo?.autoRank}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {judgeTab === "clash" && (
              <div>
                <ClashMatrix teams={teams} onUpdate={setClashes} />

                {/* Contradiction tracker */}
                <div style={{ marginTop: 24 }}>
                  <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 10, fontWeight: 600, letterSpacing: 0.5 }}>CONTRADICTION TRACKER</div>
                  {teamIds.map(tid => {
                    const t = teams[tid];
                    const color = TEAM_COLORS[tid];
                    return (
                      <div key={tid} style={{ marginBottom: 10, display: "flex", gap: 10, alignItems: "flex-start" }}>
                        <div style={{
                          minWidth: 36, height: 36, borderRadius: 8, background: `${color}20`,
                          display: "flex", alignItems: "center", justifyContent: "center",
                          fontSize: 11, fontWeight: 800, color, border: `1px solid ${color}30`,
                        }}>{tid}</div>
                        <textarea
                          value={t.contradictions?.join("\n") || ""}
                          onChange={e => updateTeam(tid, { ...t, contradictions: e.target.value.split("\n") })}
                          placeholder={`Any contradictions noted in ${tid}?`}
                          style={{
                            flex: 1, background: "rgba(239,68,68,0.04)", border: "1px solid rgba(239,68,68,0.1)",
                            borderRadius: 8, color: "#fff", fontSize: 12, padding: "8px 10px", resize: "vertical",
                            minHeight: 48, outline: "none", lineHeight: 1.5,
                          }} />
                      </div>
                    );
                  })}
                </div>

                {/* Bench comparison */}
                {mode === "BP" && (
                  <div style={{ marginTop: 24 }}>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 10, fontWeight: 600, letterSpacing: 0.5 }}>BENCH & HALF ANALYSIS</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                      {[
                        { label: "Government Bench", ids: ["OG", "CG"], color: "#818cf8" },
                        { label: "Opposition Bench", ids: ["OO", "CO"], color: "#fb923c" },
                        { label: "Opening Half", ids: ["OG", "OO"], color: "#4ade80" },
                        { label: "Closing Half", ids: ["CG", "CO"], color: "#f472b6" },
                      ].map(bench => {
                        const totals = bench.ids.map(id => teams[id]?.speakers.reduce((s, sp) => s + Number(sp.score || 0), 0) || 0);
                        const winner = totals[0] > totals[1] ? bench.ids[0] : totals[1] > totals[0] ? bench.ids[1] : "Tied";
                        return (
                          <div key={bench.label} style={{
                            background: `${bench.color}08`, border: `1px solid ${bench.color}20`,
                            borderRadius: 10, padding: 12,
                          }}>
                            <div style={{ fontSize: 11, color: bench.color, fontWeight: 700, marginBottom: 8 }}>{bench.label}</div>
                            {bench.ids.map((id, i) => (
                              <div key={id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}>
                                <span style={{ color: "rgba(255,255,255,0.5)" }}>{id}</span>
                                <span style={{ fontWeight: 700, color: winner === id ? bench.color : "rgba(255,255,255,0.7)" }}>{totals[i]}</span>
                              </div>
                            ))}
                            <div style={{ marginTop: 8, fontSize: 11, color: bench.color, fontWeight: 600 }}>
                              {winner === "Tied" ? "⚖️ Tied" : `→ ${winner} leads`}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}

            {judgeTab === "oa" && (
              <OAPanel teams={teams} rankings={rankings} mode={mode} oaNotes={oaNotes} onUpdateOA={setOANotes} />
            )}
          </div>

          {/* Floating timer */}
          <FloatingTimer mode={mode} />
        </div>
      );
    }

    // Mount to the root DOM node
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
