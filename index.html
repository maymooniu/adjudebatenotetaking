function submitQuickNote(){
  const inp=document.getElementById("quick-input");
  const sel=document.getElementById("quick-team-sel");
  const text=(inp?.value||"").trim();
  if(!text) return;
  S.quickNotes.push({id:uid(),text,teamId:sel?.value||"",ts:Date.now()});
  if(inp) inp.value="";
  // Re-inject hotbar
  const old=document.getElementById("quick-hotbar");
  if(old){ const div=document.createElement("div"); div.innerHTML=renderQuickHotbar(); old.replaceWith(div.firstElementChild); }
  if(S.judgeTab==="flow"){ const c=document.getElementById("content"); if(c) c.innerHTML=renderFlowTab(teamIds()); }
  showToast("⚡ Note captured","success");
}
function deleteQuickNote(id){
  S.quickNotes=S.quickNotes.filter(n=>n.id!==id);
  if(S.judgeTab==="flow"){ const c=document.getElementById("content"); if(c) c.innerHTML=renderFlowTab(teamIds()); }
}
function updateFlowNote(teamId,spIdx,value){
  if(S.teams[teamId]?.speakers[spIdx]) S.teams[teamId].speakers[spIdx].flowNotes=value;
}

// ══════════════════════════════════════════════════════════════════════════════
// UNDO — for argument deletions
// ══════════════════════════════════════════════════════════════════════════════
function undoableDeleteArgument(teamId,argId){
  const arg=S.teams[teamId]?.arguments.find(a=>a.id===argId);
  if(!arg) return;
  const idx=S.teams[teamId].arguments.findIndex(a=>a.id===argId);
  S.undoStack.push({type:"deleteArg",teamId,arg,idx});
  if(S.undoStack.length>20) S.undoStack.shift();
  S.teams[teamId].arguments=S.teams[teamId].arguments.filter(a=>a.id!==argId);
  partialRenderTeams();
  showUndoToast("Argument deleted","undoDeleteArg");
}
function undoDeleteArg(){
  const entries=S.undoStack.filter(e=>e.type==="deleteArg");
  if(!entries.length) return;
  const entry=entries[entries.length-1];
  S.undoStack=S.undoStack.filter(e=>e!==entry);
  S.teams[entry.teamId].arguments.splice(entry.idx,0,entry.arg);
  partialRenderTeams();
  showToast("↩ Argument restored","success");
  document.getElementById("undo-toast")?.remove();
}
let _undoTimer=null;
function showUndoToast(label,undoFn){
  document.getElementById("undo-toast")?.remove();
  const el=document.createElement("div");
  el.id="undo-toast";
  el.innerHTML=`<span style="color:var(--text2);font-size:13px">${label}</span><button onclick="${undoFn}()" style="padding:4px 14px;border-radius:8px;background:var(--accent2);color:var(--accent);border:1.5px solid var(--accent3);font-size:12px;font-weight:700;cursor:pointer">↩ Undo</button><button onclick="this.closest('#undo-toast').remove()" style="background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0;line-height:1">×</button>`;
  document.body.appendChild(el);
  clearTimeout(_undoTimer);
  _undoTimer=setTimeout(()=>document.getElementById("undo-toast")?.remove(),5000);
}

// ══════════════════════════════════════════════════════════════════════════════
// DELIBERATION MODE
// ══════════════════════════════════════════════════════════════════════════════
let _deliberTimer=null;
function openDeliberation(){
  const t=document.getElementById("title-input"); if(t) S.sessionTitle=t.value;
  const m=document.getElementById("motion-input"); if(m) S.motion=m.value;
  const o=document.getElementById("oa-textarea"); if(o) S.oaNotes=o.value;
  S.deliberationElapsed=0; S.deliberationRunning=true;
  stopTimerInterval();
  document.getElementById("delib-overlay")?.remove();
  const el=document.createElement("div");
  el.id="delib-overlay";
  el.innerHTML=renderDeliberationView();
  document.body.appendChild(el);
  clearInterval(_deliberTimer);
  _deliberTimer=setInterval(()=>{
    S.deliberationElapsed++;
    const td=document.getElementById("delib-timer-display");
    const remaining=Math.max(0,20*60-S.deliberationElapsed);
    if(td){
      td.textContent=fmtTime(remaining);
      td.style.color=remaining<=0?"#ef4444":remaining<=120?"#f59e0b":"#4ade80";
      td.style.animation=remaining<=0?"blink .8s step-end infinite":"none";
    }
    if(S.deliberationElapsed===20*60) showToast("⏰ 20 minutes — time to decide!","warn");
  },1000);
}
function closeDeliberation(){
  clearInterval(_deliberTimer);
  document.getElementById("delib-overlay")?.remove();
  S.deliberationRunning=false;
}
function renderDeliberationView(){
  const ids=teamIds();
  const rankings=computeRankings(S.teams);
  const sorted=[...rankings].sort((a,b)=>a.autoRank-b.autoRank);
  const pairs=[];
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) pairs.push([ids[i],ids[j]]);
  const wins={};
  ids.forEach(id=>wins[id]=0);
  pairs.forEach(([a,b])=>{
    const key=[a,b].sort().join("_vs_");
    const cl=S.clashes[key]||{};
    if(cl.winner===a) wins[a]++;
    else if(cl.winner===b) wins[b]++;
  });
  const maxTotal=Math.max(...ids.map(id=>S.teams[id]?.speakers.reduce((s,sp)=>s+Number(sp.score||0),0)||0));
  return `
  <div class="delib-topbar">
    <div style="flex:1;min-width:0">
      <div style="font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px">🔴 Deliberation Mode</div>
      <div style="font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(S.sessionTitle||S.mode+" Session")}</div>
      ${S.motion?`<div style="font-size:12px;color:var(--text3);font-style:italic;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(S.motion)}</div>`:""}
    </div>
    <div style="text-align:center;flex-shrink:0;padding:0 20px">
      <div style="font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.5px">TIME LEFT</div>
      <div id="delib-timer-display" class="delib-timer" style="color:#4ade80">${fmtTime(20*60)}</div>
      <div style="font-size:10px;color:var(--text3)">20 min limit</div>
    </div>
    <button onclick="closeDeliberation()" class="btn btn-danger" style="flex-shrink:0">✕ Exit</button>
  </div>
  <div style="padding:20px 24px;max-width:1200px;margin:0 auto">
    <div style="margin-bottom:20px">
      <div class="label-xs" style="margin-bottom:10px">Rankings by score</div>
      <div style="display:grid;grid-template-columns:repeat(${ids.length},1fr);gap:10px">
        ${sorted.map((r,i)=>{
          const col=TEAM_COLORS[r.id];
          const pct=maxTotal>0?Math.round((r.total/maxTotal)*100):0;
          return `<div style="text-align:center;padding:12px;border-radius:12px;background:${col}10;border:1.5px solid ${col}30">
            <div style="font-size:20px">${RANK_EMOJI[i]}</div>
            <div style="font-size:16px;font-weight:800;color:${col}">${r.id}</div>
            <div style="font-size:22px;font-weight:800">${r.total}</div>
            <div style="background:var(--bg4);border-radius:4px;height:6px;margin:6px 0;overflow:hidden"><div style="height:100%;width:${pct}%;background:${col};border-radius:4px"></div></div>
            <div style="font-size:10px;color:var(--text3)">${wins[r.id]} clash${wins[r.id]!==1?"es":""} won</div>
          </div>`;
        }).join("")}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(${Math.min(ids.length,2)},1fr);gap:14px;margin-bottom:20px">
      ${ids.map(tid=>{
        const t=S.teams[tid]; if(!t) return "";
        const col=TEAM_COLORS[tid];
        const total=t.speakers.reduce((s,sp)=>s+Number(sp.score||0),0);
        const ri=rankings.find(r=>r.id===tid);
        return `<div class="delib-team-col" style="border-top:3px solid ${col}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div><span class="badge" style="background:${col}20;color:${col};border:1px solid ${col}40">${t.abbr}</span><span style="margin-left:8px;font-size:13px;font-weight:700">${t.label}</span></div>
            <span style="font-size:16px;font-weight:800;color:${col}">Σ${total} #${ri?.autoRank||"?"}</span>
          </div>
          ${t.speakers.map(sp=>{
            const sc=Number(sp.score||75);
            const scCol=sc>=83?"#22c55e":sc>=73?"#f59e0b":"#ef4444";
            return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">${esc(sp.name||sp.role)}</span><span style="font-weight:700;color:${scCol}">${sc}</span></div>`;
          }).join("")}
          ${t.teamNotes?`<div style="margin-top:8px;font-size:12px;color:var(--text2);line-height:1.55;white-space:pre-wrap">${esc(t.teamNotes)}</div>`:""}
          ${(t.arguments||[]).length?`<div style="margin-top:10px">${t.arguments.map(a=>{
            const ac={strong:"#22c55e",medium:"#f59e0b",weak:"#f87171"}[a.strength];
            const sc={standing:"var(--text2)",rebutted:"#f87171",conceded:"#4ade80",dropped:"var(--text3)"}[a.status];
            return `<div class="delib-arg-row" style="border-left-color:${ac};background:${ac}08">
              <span style="font-size:10px;font-weight:700;color:${ac}">${a.strength.toUpperCase()}</span>
              ${a.tag?`<span style="font-size:10px;color:var(--text3)"> · ${a.tag}</span>`:""}
              <span style="font-size:10px;color:var(--text3)"> [${a.status}]</span>
              <div style="margin-top:2px;color:${sc}">${esc(a.text)}</div>
              ${a.rebuttsArgId?`<div style="font-size:10px;color:var(--accent);margin-top:2px">↩ links to opposing argument</div>`:""}
            </div>`;
          }).join("")}</div>`:""}
        </div>`;
      }).join("")}
    </div>
    <div class="label-xs" style="margin-bottom:10px">Clash outcomes</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:20px">
      ${pairs.map(([a,b])=>{
        const key=[a,b].sort().join("_vs_");
        const cl=S.clashes[key]||{};
        const wc=cl.winner&&cl.winner!=="Even"?TEAM_COLORS[cl.winner]||"#888":"#888";
        return `<div style="padding:12px;border-radius:10px;background:var(--bg3);border:1.5px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:12px;font-weight:700"><span style="color:${TEAM_COLORS[a]}">${a}</span> vs <span style="color:${TEAM_COLORS[b]}">${b}</span></span>
            ${cl.winner?`<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:${wc}20;color:${wc};font-weight:700">${cl.winner==="Even"?"⚖ Even":"→ "+cl.winner}</span>`:`<span style="font-size:10px;color:var(--text3)">undecided</span>`}
          </div>
          ${cl.notes?`<div style="font-size:11px;color:var(--text2)">${esc(cl.notes.slice(0,100))}${cl.notes.length>100?"…":""}</div>`:""}
        </div>`;
      }).join("")}
    </div>
    ${S.oaNotes?`<div class="label-xs" style="margin-bottom:8px">OA Notes</div><div style="background:var(--bg3);border:1.5px solid rgba(129,140,248,0.2);border-radius:10px;padding:14px;font-family:var(--font-mono);font-size:12px;line-height:1.7;white-space:pre-wrap;color:var(--text2);margin-bottom:20px">${esc(S.oaNotes)}</div>`:""}

          <div style="display:flex;align-items:center;gap:10px">

async function doSave(target) {
  document.getElementById("save-modal")?.remove();
  S.saving = true;
  const btn = document.getElementById("save-btn");
  if(btn){ btn.textContent="Saving…"; btn.disabled=true; }

  const now = new Date().toISOString();
  const sessionId = S.editingId || uid();
  const rankings  = computeRankings(S.teams);
  const sessionData = {
    id:          sessionId,
    title:       S.sessionTitle || (S.mode + " Session"),
    mode:        S.mode,
    motion:      S.motion,
    round:       S.round,
    teams:       S.teams,
    oaNotes:     S.oaNotes,
    clashes:     S.clashes,
    quickNotes:  S.quickNotes,
    rankings:    rankings.map(r=>({id:r.id, total:r.total, autoRank:r.autoRank})),
    savedAt:     now,
    created_at:  now,
    storageType: target,
  };

  // Always write to localStorage
  S.editingId = sessionId;
  const existing = S.savedNotes.filter(n => n.id !== sessionId);
  S.savedNotes = [sessionData, ...existing];
  persistSaved();

  let cloudOk = false;
  if (target === "cloud" && db) {
    try {
      const { error } = await db.from(TABLE).upsert(sessionToDb(sessionData), { onConflict:"id" });
      if (error) throw new Error(error.message);
      cloudOk = true;
      cloudStatus = "online";
      // Update storageType label in local copy
      S.savedNotes[0].storageType = "cloud";
      persistSaved();
      showToast("☁️ Saved to cloud", "success");
    } catch(e) {
      console.error("Cloud save error:", e.message);
      showToast("⚠ Cloud save failed: " + e.message.slice(0, 50), "error");
    }
  } else if (target === "local") {
    showToast("💾 Saved locally", "success");
  }

  S.saving = false;
  const label = (target === "cloud" && cloudOk) ? "☁️ Saved!" : "💾 Saved!";
  S.saveMsg = label;
  if(btn){ btn.textContent=label; btn.className="btn btn-success"; btn.disabled=false; }
  setTimeout(() => {
    S.saveMsg = "";
    const b = document.getElementById("save-btn");
    if(b){ b.textContent="💾 Save"; b.className="btn btn-primary"; }
  }, 3000);
}

// Keep old saveSession as alias for topbar button (now opens modal)
function saveSession(){ showSaveModal(); }

// BIND JUDGE VIEW

function bindJudge(){
  const sync = () => saveDraft();
  const titleEl=document.getElementById("title-input");
  if(titleEl){ titleEl.addEventListener("input",()=>{ S.sessionTitle=titleEl.value; sync(); }); }
  const motionEl=document.getElementById("motion-input");
  if(motionEl){ motionEl.addEventListener("input",()=>{ S.motion=motionEl.value; sync(); }); }
  const roundEl=document.getElementById("round-input");
  if(roundEl){ roundEl.addEventListener("input",()=>{ S.round=roundEl.value; sync(); }); }
  // Also save draft when any textarea/input inside content changes
  const content=document.getElementById("content");
  if(content){ content.addEventListener("input", sync, { passive:true }); }
}

// ══════════════════════════════════════════════════════════════════════════════
// DRAFT — auto-save active session to localStorage every 15s + on any change
// ══════════════════════════════════════════════════════════════════════════════
const DRAFT_KEY = "adj_draft_session";

function saveDraft() {
  if (S.view !== "judge") return;
  // Flush any live DOM inputs first
  const t=document.getElementById("title-input");  if(t) S.sessionTitle=t.value;
  const m=document.getElementById("motion-input"); if(m) S.motion=m.value;
  const r=document.getElementById("round-input");  if(r) S.round=r.value;
  const o=document.getElementById("oa-textarea");  if(o) S.oaNotes=o.value;
  try {
    const draft = {
      view: "judge",
      mode: S.mode, sessionTitle: S.sessionTitle, motion: S.motion,
      round: S.round, teams: S.teams, oaNotes: S.oaNotes,
      clashes: S.clashes, editingId: S.editingId,
      activeTeamTab: S.activeTeamTab, judgeTab: S.judgeTab,
      quickNotes: S.quickNotes,
      ts: Date.now(),
    };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  } catch(e) { /* storage full — ignore */ }
}

function clearDraft() {
  localStorage.removeItem(DRAFT_KEY);
}

function hasDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    // Only offer restore if draft is < 24 hours old
    return d && d.ts && (Date.now() - d.ts) < 86400000;
  } catch(e) { return false; }
}

function restoreDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (!d) return;
    S.mode = d.mode || "BP";
    S.sessionTitle = d.sessionTitle || "";
    S.motion = d.motion || "";
    S.round = d.round || "";
    S.teams = d.teams || (d.mode === "AP" ? defaultAPSession() : defaultBPSession());
    S.oaNotes = d.oaNotes || "";
    S.clashes = d.clashes || {};
    S.quickNotes = d.quickNotes || [];
    S.editingId = d.editingId || null;
    S.activeTeamTab = d.activeTeamTab || (d.mode === "AP" ? "GOV" : "OG");
    S.judgeTab = d.judgeTab || "teams";
    S.showScale = {};
    S.view = "judge";
    clearDraft();
    render();
    showToast("✓ Session restored", "success");
  } catch(e) {
    console.warn("Draft restore failed:", e);
  }
}

// ── Restore banner shown on home screen ──────────────────────────────────────
function renderDraftBanner() {
  if (!hasDraft()) return "";
  let d;
  try { d = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch(e) { return ""; }
  const ago = Math.round((Date.now() - d.ts) / 60000);
  const agoStr = ago < 1 ? "just now" : ago < 60 ? ago + "m ago" : Math.round(ago/60) + "h ago";
  return `
  <div style="margin-top:20px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.25);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:12px;max-width:560px;width:100%">
    <span style="font-size:22px">📋</span>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:700;color:#fbbf24">Unsaved session found</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.45);margin-top:2px">${esc(d.sessionTitle||d.mode+" Session")} · ${d.mode} · ${agoStr}</div>
    </div>
    <button onclick="restoreDraft()" style="padding:7px 16px;border-radius:8px;background:rgba(251,191,36,0.2);color:#fbbf24;border:1px solid rgba(251,191,36,0.35);font-size:12px;font-weight:700;cursor:pointer">Restore</button>
    <button onclick="clearDraft();document.getElementById('draft-banner')?.remove()" style="background:none;border:none;color:rgba(255,255,255,0.3);font-size:18px;cursor:pointer;padding:0;line-height:1">×</button>
  </div>`;
}

// INIT

loadPrefs();   // must be before applyPrefs and first render
try { S.savedNotes = JSON.parse(localStorage.getItem("adj_sessions") || "[]"); } catch(e) { S.savedNotes = []; }

// Auto-restore if the user refreshed mid-session (draft < 5 minutes old)
(function autoRestore() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d || !d.ts) return;
    const ageMs = Date.now() - d.ts;
    if (ageMs < 5 * 60 * 1000 && d.view === "judge" && d.mode) {
      S.mode          = d.mode || "BP";
      S.sessionTitle  = d.sessionTitle || "";
      S.motion        = d.motion || "";
      S.round         = d.round || "";
      S.teams         = d.teams || (d.mode === "AP" ? defaultAPSession() : defaultBPSession());
      S.oaNotes       = d.oaNotes || "";
      S.clashes       = d.clashes || {};
      S.quickNotes    = d.quickNotes || [];
      S.editingId     = d.editingId || null;
      S.activeTeamTab = d.activeTeamTab || (d.mode === "AP" ? "GOV" : "OG");
      S.judgeTab      = d.judgeTab || "teams";
      S.showScale     = {};
      S.view          = "judge";
    }
  } catch(e) {}
})();

applyPrefs();  // apply theme/accent/font before first render
render();

if (S.view === "judge") {
  setTimeout(() => showToast("📋 Session restored from last visit", "success"), 400);
}

// Auto-draft interval (respects PREFS.draftInterval)
let _draftInterval = setInterval(saveDraft, (PREFS.draftInterval || 15) * 1000);
// Refresh interval when pref changes
const _origSetPref = setPref;

// Save draft on page hide/unload
window.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") saveDraft(); });
window.addEventListener("pagehide", saveDraft);
window.addEventListener("beforeunload", saveDraft);

loadSaved(); // sync cloud in background
</script>
